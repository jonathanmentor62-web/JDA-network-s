<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JDA Networks — Administrator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b141a;
  color:#e9edef;
}

header{
  background:#202c33;
  padding:18px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #303c43;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  font-size:22px;
}

header small{
  display:block;
  color:#8696a0;
  margin-top:5px;
}

.logout{
  background:#26343b;
  color:white;
  border:0;
  padding:10px 16px;
  border-radius:22px;
  font-weight:bold;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:16px;
}

.admin-account{
  background:#111b21;
  border:1px solid #303c43;
  border-radius:15px;
  padding:12px 15px;
  margin-bottom:15px;
  color:#aebac1;
  font-size:13px;
}

.admin-account b{
  color:#25d366;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:25px;
}

.stat{
  background:#202c33;
  border-radius:17px;
  padding:20px 10px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:30px;
}

.stat span{
  display:block;
  margin-top:5px;
  color:#8696a0;
  font-size:13px;
}

.section-title{
  font-size:20px;
  margin:28px 0 12px;
}

.application{
  background:#202c33;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  display:flex;
  gap:15px;
}

.application img{
  width:75px;
  height:75px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
  border:2px solid #25d366;
}

.details{
  flex:1;
  min-width:0;
}

.name{
  font-size:18px;
  font-weight:bold;
  margin-bottom:6px;
}

.number{
  color:#25d366;
  font-weight:bold;
  margin-bottom:7px;
}

.info{
  color:#aebac1;
  font-size:13px;
  line-height:1.6;
  word-break:break-word;
}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:13px;
}

button{
  border:0;
  cursor:pointer;
  font-weight:bold;
}

.approve{
  background:#25d366;
  color:#06130a;
  padding:10px 17px;
  border-radius:22px;
}

.reject{
  background:transparent;
  color:#ff7168;
  border:1px solid #ea4335;
  padding:9px 17px;
  border-radius:22px;
}

.disable{
  background:#3b2b12;
  color:#ffca67;
  padding:10px 17px;
  border-radius:22px;
}

.enable{
  background:#25d366;
  color:#06130a;
  padding:10px 17px;
  border-radius:22px;
}

.empty,.loading{
  text-align:center;
  color:#8696a0;
  padding:35px 10px;
  background:#111b21;
  border-radius:15px;
}

.error{
  display:none;
  background:#351b1b;
  color:#ffb4ae;
  padding:13px;
  border-radius:12px;
  margin-bottom:15px;
  line-height:1.5;
}

.success{
  display:none;
  background:#153c2a;
  color:#8ff0b4;
  padding:13px;
  border-radius:12px;
  margin-bottom:15px;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }

  .application{
    padding:14px;
  }

  .application img{
    width:65px;
    height:65px;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>JDA Networks</h1>
    <small>Administrator Panel</small>
  </div>

  <button class="logout" id="logoutBtn">
    Logout
  </button>
</header>

<div class="container">

  <div id="accountBox" class="admin-account">
    Checking administrator account...
  </div>

  <div id="errorBox" class="error"></div>
  <div id="successBox" class="success"></div>

  <div class="stats">
    <div class="stat">
      <strong id="pendingCount">0</strong>
      <span>Pending</span>
    </div>

    <div class="stat">
      <strong id="approvedCount">0</strong>
      <span>Approved</span>
    </div>

    <div class="stat">
      <strong id="disabledCount">0</strong>
      <span>Disabled</span>
    </div>
  </div>

  <h2 class="section-title">🔔 Approval Requests</h2>

  <div id="pendingList">
    <div class="loading">Loading registrations...</div>
  </div>

  <h2 class="section-title">✅ Approved Members</h2>

  <div id="approvedList">
    <div class="loading">Loading approved members...</div>
  </div>

  <h2 class="section-title">🚫 Disabled Members</h2>

  <div id="disabledList">
    <div class="loading">Loading disabled members...</div>
  </div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  updateDoc,
  serverTimestamp,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyAPnOHdVISPw_fGBLdMLELSU9f1IWMTC3I",
  authDomain: "jda-network-fabde.firebaseapp.com",
  projectId: "jda-network-fabde",
  storageBucket: "jda-network-fabde.firebasestorage.app",
  messagingSenderId: "383915852673",
  appId: "1:383915852673:web:4b185c0387ed0bbad1de80"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

const SUPER_ADMIN =
  "jonathanmentor62@gmail.com";


/* =========================
   ELEMENTS
========================= */

const pendingList =
  document.getElementById("pendingList");

const approvedList =
  document.getElementById("approvedList");

const disabledList =
  document.getElementById("disabledList");

const pendingCount =
  document.getElementById("pendingCount");

const approvedCount =
  document.getElementById("approvedCount");

const disabledCount =
  document.getElementById("disabledCount");

const errorBox =
  document.getElementById("errorBox");

const successBox =
  document.getElementById("successBox");

const accountBox =
  document.getElementById("accountBox");

const logoutBtn =
  document.getElementById("logoutBtn");


/* =========================
   MESSAGES
========================= */

function showError(message){

  errorBox.textContent = message;
  errorBox.style.display = "block";

}

function showSuccess(message){

  successBox.textContent = message;
  successBox.style.display = "block";

  setTimeout(()=>{
    successBox.style.display = "none";
  },4000);

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value=""){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   NAME
========================= */

function getName(data){

  return data.realName ||
         data.fullName ||
         "Unknown member";

}


/* =========================
   PHOTO
========================= */

function getPhoto(data){

  if(data.photoURL)
    return data.photoURL;

  if(data.profilePhoto)
    return data.profilePhoto;

  if(data.photoUrl)
    return data.photoUrl;

  return "https://ui-avatars.com/api/?name="+
    encodeURIComponent(getName(data))+
    "&background=202c33&color=ffffff";

}


/* =========================
   DATE
========================= */

function formatDate(timestamp){

  if(!timestamp)
    return "Date unavailable";

  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleString();

  }catch{

    return "Date unavailable";

  }

}


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(user){

  if(!user){

    location.href="./index.html";
    return false;

  }


  const email =
    (user.email || "").trim().toLowerCase();


  accountBox.innerHTML =
    "Signed in as: <b>"+
    escapeHTML(user.email || "No email")+
    "</b>";


  /* SUPER ADMIN */

  if(email === SUPER_ADMIN.toLowerCase()){

    accountBox.innerHTML =
      "Administrator: <b>"+
      escapeHTML(user.email)+
      "</b> ✓ Super Admin";

    return true;

  }


  /* OTHER ADMIN */

  try{

    const adminQuery =
      query(
        collection(db,"admins"),
        where("uid","==",user.uid)
      );

    const result =
      await getDocs(adminQuery);

    if(!result.empty){

      accountBox.innerHTML =
        "Administrator: <b>"+
        escapeHTML(user.email || "")+
        "</b> ✓ Admin";

      return true;

    }

  }catch(error){

    console.error(
      "Admin collection error:",
      error
    );

  }


  showError(
    "Administrator access denied.\n\n"+
    "Currently signed in as: "+
    (user.email || "Unknown account")+
    "\n\n"+
    "The Super Admin account is: "+
    SUPER_ADMIN
  );

  return false;

}


/* =========================
   MEMBER CARD
========================= */

function memberCard(member,status){

  const id = member.id;
  const data = member.data;

  const name =
    escapeHTML(getName(data));

  const number =
    escapeHTML(
      data.jdaNumber ||
      data.phone ||
      data.phoneNumber ||
      ""
    );

  const email =
    escapeHTML(data.email || "");

  const photo =
    escapeHTML(getPhoto(data));

  let education="";

  if(data.accountType === "student"){

    education =
      data.className ||
      data.class ||
      data.studentClass ||
      "";

    education =
      escapeHTML(education);

    if(data.stream){

      education +=
        " • "+
        escapeHTML(data.stream);

    }

  }else{

    education =
      escapeHTML(
        data.department || ""
      );

  }


  let buttons="";


  if(status==="pending"){

    buttons=`
      <button
        class="approve"
        onclick="approveMember('${id}')">
        ✓ Approve
      </button>

      <button
        class="reject"
        onclick="rejectMember('${id}')">
        Reject
      </button>
    `;

  }

  else if(status==="approved"){

    buttons=`
      <button
        class="disable"
        onclick="disableMember('${id}')">
        Disable
      </button>
    `;

  }

  else{

    buttons=`
      <button
        class="enable"
        onclick="enableMember('${id}')">
        Enable
      </button>
    `;

  }


  return `
    <div class="application">

      <img
        src="${photo}"
        alt="Profile photo">

      <div class="details">

        <div class="name">
          ${name}
        </div>

        <div class="number">
          ${number}
        </div>

        <div class="info">

          ${
            email
              ? "📧 "+email+"<br>"
              : ""
          }

          ${
            education
              ? "🏫 "+education+"<br>"
              : ""
          }

          ${
            data.accountType
              ? "👤 "+
                escapeHTML(data.accountType)+
                "<br>"
              : ""
          }

          🕒 Registered:
          ${formatDate(data.createdAt)}

        </div>

        <div class="buttons">
          ${buttons}
        </div>

      </div>

    </div>
  `;

}


/* =========================
   REALTIME USERS
========================= */

function startRealtime(){

  const usersRef =
    collection(db,"users");


  /* PENDING */

  const pendingQuery =
    query(
      usersRef,
      where("status","==","pending")
    );

  onSnapshot(
    pendingQuery,

    snapshot=>{

      const members=[];

      snapshot.forEach(item=>{

        members.push({
          id:item.id,
          data:item.data()
        });

      });

      pendingCount.textContent =
        members.length;


      if(!members.length){

        pendingList.innerHTML=`
          <div class="empty">
            🎉 No pending registrations.
          </div>
        `;

      }else{

        members.sort(
          (a,b)=>
            (b.data.createdAt?.seconds||0)-
            (a.data.createdAt?.seconds||0)
        );

        pendingList.innerHTML =
          members
          .map(
            m=>memberCard(m,"pending")
          )
          .join("");

      }

    },

    error=>{

      console.error(error);

      showError(
        "Could not load pending registrations:\n\n"+
        error.message
      );

    }
  );


  /* APPROVED */

  const approvedQuery =
    query(
      usersRef,
      where("status","==","approved")
    );

  onSnapshot(
    approvedQuery,

    snapshot=>{

      const members=[];

      snapshot.forEach(item=>{

        members.push({
          id:item.id,
          data:item.data()
        });

      });

      approvedCount.textContent =
        members.length;


      if(!members.length){

        approvedList.innerHTML=`
          <div class="empty">
            No approved members yet.
          </div>
        `;

      }else{

        approvedList.innerHTML =
          members
          .map(
            m=>memberCard(m,"approved")
          )
          .join("");

      }

    },

    error=>{

      console.error(error);

      showError(
        "Could not load approved members:\n\n"+
        error.message
      );

    }
  );


  /* DISABLED */

  const disabledQuery =
    query(
      usersRef,
      where("status","==","disabled")
    );

  onSnapshot(
    disabledQuery,

    snapshot=>{

      const members=[];

      snapshot.forEach(item=>{

        members.push({
          id:item.id,
          data:item.data()
        });

      });

      disabledCount.textContent =
        members.length;


      if(!members.length){

        disabledList.innerHTML=`
          <div class="empty">
            No disabled members.
          </div>
        `;

      }else{

        disabledList.innerHTML =
          members
          .map(
            m=>memberCard(m,"disabled")
          )
          .join("");

      }

    },

    error=>{

      console.error(error);

      showError(
        "Could not load disabled members:\n\n"+
        error.message
      );

    }
  );

}


/* =========================
   APPROVE
========================= */

window.approveMember =
async function(uid){

  if(!confirm(
    "Approve this member for JDA Networks?"
  )) return;


  try{

    await updateDoc(
      doc(db,"users",uid),
      {
        status:"approved",
        approved:true,
        approvedAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      }
    );

    showSuccess(
      "✓ Member approved successfully."
    );

  }catch(error){

    console.error(error);

    showError(
      "Approval failed:\n\n"+
      error.message
    );

  }

};


/* =========================
   REJECT
========================= */

window.rejectMember =
async function(uid){

  if(!confirm(
    "Reject this registration?"
  )) return;


  try{

    await updateDoc(
      doc(db,"users",uid),
      {
        status:"rejected",
        approved:false,
        updatedAt:serverTimestamp()
      }
    );

    showSuccess(
      "Registration rejected."
    );

  }catch(error){

    console.error(error);

    showError(
      "Reject failed:\n\n"+
      error.message
    );

  }

};


/* =========================
   DISABLE
========================= */

window.disableMember =
async function(uid){

  if(!confirm(
    "Disable this member?"
  )) return;


  try{

    await updateDoc(
      doc(db,"users",uid),
      {
        status:"disabled",
        approved:false,
        updatedAt:serverTimestamp()
      }
    );

    showSuccess(
      "Member disabled."
    );

  }catch(error){

    console.error(error);

    showError(
      "Disable failed:\n\n"+
      error.message
    );

  }

};


/* =========================
   ENABLE
========================= */

window.enableMember =
async function(uid){

  if(!confirm(
    "Enable this member again?"
  )) return;


  try{

    await updateDoc(
      doc(db,"users",uid),
      {
        status:"approved",
        approved:true,
        updatedAt:serverTimestamp()
      }
    );

    showSuccess(
      "Member enabled."
    );

  }catch(error){

    console.error(error);

    showError(
      "Enable failed:\n\n"+
      error.message
    );

  }

};


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async user=>{

    const allowed =
      await checkAdmin(user);

    if(!allowed){

      return;

    }

    startRealtime();

  }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.onclick =
async function(){

  try{

    await signOut(auth);

    location.href="./index.html";

  }catch(error){

    showError(error.message);

  }

};

</script>

</body>
</html>
