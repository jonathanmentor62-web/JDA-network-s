<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JDA Networks - FIXED</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#0b141a;color:#fff}body{overflow-x:hidden}button,input{font-family:inherit}button{cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}.hidden{display:none!important}.header{height:64px;background:#202c33;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#374952}.brand-title{font-size:18px;font-weight:bold}.header-buttons{display:flex;gap:8px}.icon-btn{width:40px;height:40px;border-radius:50%;background:#374952;color:white;font-size:18px}.container{width:100%;max-width:900px;margin:auto;padding-bottom:100px}.search{padding:12px}.search input{width:100%;padding:13px 17px;border:0;outline:0;border-radius:25px;background:#202c33;color:white;font-size:14px}.search input::placeholder{color:#8696a0}.filters{display:flex;gap:8px;overflow-x:auto;padding:0 12px 12px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;padding:9px 15px;border-radius:18px;background:#202c33;color:#aebac1;font-size:13px;flex-shrink:0}.filter.active{background:#25d366;color:#07130b}.section{padding:10px 15px;color:#8696a0;font-size:13px;font-weight:bold}.member{display:flex;align-items:center;gap:13px;padding:12px 15px;border-bottom:1px solid #202c33;cursor:pointer;min-height:77px}.member:active{background:#202c33}.member img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#202c33;flex-shrink:0}.member-info{flex:1;min-width:0}.member-name{font-weight:bold;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.member-detail{color:#8696a0;font-size:12px;margin-top:4px}.status{width:9px;height:9px;border-radius:50%;background:#25d366;flex-shrink:0}.empty{text-align:center;padding:45px 20px;color:#667781;font-size:14px}.loading{text-align:center;padding:35px 20px;color:#8696a0}.error-box{margin:20px 15px;padding:14px;border-radius:12px;background:#3b2024;color:#ff9b9b;font-size:13px;line-height:1.5}.bottom{position:fixed;bottom:0;left:0;right:0;height:65px;background:#202c33;display:flex;justify-content:space-around;align-items:center;z-index:20}.nav{background:none;color:#8696a0;font-size:11px;text-align:center;min-width:75px}.nav span{display:block;font-size:20px;margin-bottom:2px}.nav.active{color:#25d366}.new-chat{position:fixed;right:20px;bottom:82px;width:55px;height:55px;border-radius:18px;background:#25d366;color:#07130b;font-size:25px;z-index:15;box-shadow:0 4px 15px rgba(0,0,0,.3)}.chat{display:none;position:fixed;inset:0;background:#0b141a;z-index:50}.chat.open{display:block}.chat-header{height:64px;background:#202c33;display:flex;align-items:center;gap:10px;padding:0 12px}.back{background:none;color:white;font-size:25px;padding:5px 8px}.chat-header img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#374952}.chat-user{flex:1;min-width:0}.chat-user strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-user small{color:#8696a0}.messages{position:absolute;top:64px;bottom:65px;left:0;right:0;overflow-y:auto;padding:15px 10px 20px;background:#0b141a}.message{max-width:78%;padding:9px 12px;margin:5px 0;border-radius:9px;font-size:14px;line-height:1.35;word-wrap:break-word}.message.mine{margin-left:auto;background:#005c4b}.message.theirs{margin-right:auto;background:#202c33}.message-time{display:block;color:#b2c0c8;font-size:9px;text-align:right;margin-top:4px}.message-form{position:absolute;bottom:0;left:0;right:0;height:65px;background:#202c33;display:flex;gap:8px;align-items:center;padding:8px}.message-form input{flex:1;min-width:0;border:0;outline:0;border-radius:24px;background:#111b21;color:white;padding:13px 16px}.send{width:45px;height:45px;border-radius:50%;background:#25d366;color:#07130b;font-size:18px;flex-shrink:0}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;align-items:flex-end;justify-content:center}.modal.open{display:flex}.modal-card{width:100%;max-width:600px;background:#202c33;border-radius:20px 20px 0 0;padding:25px;max-height:85vh;overflow-y:auto}.profile-center{text-align:center}.profile-center img{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#111b21}.profile-name{font-size:21px;font-weight:bold;margin-top:12px}.profile-info{color:#8696a0;margin-top:8px;line-height:1.5}.close{width:100%;margin-top:20px;padding:13px;border-radius:25px;background:#374952;color:white}.logout{width:100%;margin-top:10px;padding:13px;border-radius:25px;background:#3b2024;color:#ff9b9b;font-weight:bold}.startup{position:fixed;inset:0;background:#0b141a;z-index:200;display:flex;align-items:center;justify-content:center;padding:25px}.startup.hidden{display:none}.startup-box{width:100%;max-width:420px;text-align:center;background:#202c33;padding:30px 22px;border-radius:20px}.startup-box h2{margin:0 0 10px}.startup-box p{color:#8696a0;line-height:1.5;font-size:14px}.startup-btn{width:100%;padding:14px;margin-top:15px;border-radius:25px;background:#25d366;color:#07130b;font-weight:bold}#profilePhotoInput{display:none}
</style>
</head>
<body>
<div id="startup" class="startup"><div class="startup-box"><h2>JDA Networks</h2><p id="startupText">Checking your account...</p><button id="startupButton" class="startup-btn hidden" type="button">Go to Login</button></div></div>
<header class="header"><div class="brand"><img src="./logo.png" alt="JDA Networks" onerror="this.style.display='none'"><div class="brand-title">JDA Networks</div></div><div class="header-buttons"><button class="icon-btn hidden" id="adminBtn" type="button">🛡️</button><button class="icon-btn" id="profileBtn" type="button">👤</button></div></header>
<main class="container"><div class="search"><input id="searchInput" type="text" placeholder="Search JDA Networks" autocomplete="off"></div><div class="filters"><button class="filter active" data-filter="all" type="button">All</button><button class="filter" data-filter="student" type="button">Students</button><button class="filter" data-filter="staff" type="button">Staff</button><button class="filter" data-filter="Form One" type="button">Form One</button><button class="filter" data-filter="Form Two" type="button">Form Two</button><button class="filter" data-filter="Form Three" type="button">Form Three</button><button class="filter" data-filter="Form Four" type="button">Form Four</button><button class="filter" data-filter="Form Five" type="button">Form Five</button><button class="filter" data-filter="Form Six" type="button">Form Six</button></div><div class="section" id="sectionTitle">JDA NETWORK MEMBERS</div><div id="members"><div class="loading">Loading JDA Network members...</div></div></main>
<button class="new-chat" id="newChat" type="button">✎</button>
<nav class="bottom"><button class="nav active" id="chatNav" type="button"><span>💬</span>Chats</button><button class="nav" id="networkBtn" type="button"><span>👥</span>Network</button></nav>
<div id="chat" class="chat"><header class="chat-header"><button class="back" id="closeChat" type="button">←</button><img id="chatPhoto" alt=""><div class="chat-user"><strong id="chatName">Chat</strong><small id="chatStatus">JDA Networks</small></div></header><div id="messages" class="messages"><div class="loading">Loading messages...</div></div><form id="messageForm" class="message-form"><input id="messageInput" type="text" placeholder="Type a message" maxlength="5000" autocomplete="off"><button class="send" type="submit">➤</button></form></div>
<div id="profileModal" class="modal"><div class="modal-card"><div class="profile-center"><img id="myPhoto" alt="Profile photo"><div id="myName" class="profile-name">JDA Member</div><div id="myInfo" class="profile-info">Loading...</div></div><button id="closeProfile" class="close" type="button">Close</button><button id="logoutBtn" class="logout" type="button">Logout</button></div></div>
<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { collection, query, where, getDocs, getDoc, doc, setDoc, addDoc, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const startup=document.getElementById("startup"),startupText=document.getElementById("startupText"),startupButton=document.getElementById("startupButton"),membersEl=document.getElementById("members"),searchInput=document.getElementById("searchInput"),filters=document.querySelectorAll(".filter"),sectionTitle=document.getElementById("sectionTitle"),adminBtn=document.getElementById("adminBtn"),profileBtn=document.getElementById("profileBtn"),profileModal=document.getElementById("profileModal"),closeProfile=document.getElementById("closeProfile"),logoutBtn=document.getElementById("logoutBtn"),myPhoto=document.getElementById("myPhoto"),myName=document.getElementById("myName"),myInfo=document.getElementById("myInfo"),newChat=document.getElementById("newChat"),networkBtn=document.getElementById("networkBtn"),chatNav=document.getElementById("chatNav"),chat=document.getElementById("chat"),closeChat=document.getElementById("closeChat"),chatPhoto=document.getElementById("chatPhoto"),chatName=document.getElementById("chatName"),chatStatus=document.getElementById("chatStatus"),messagesEl=document.getElementById("messages"),messageForm=document.getElementById("messageForm"),messageInput=document.getElementById("messageInput");
let currentUser=null,currentProfile=null,allMembers=[],currentFilter="all",currentChatUser=null,unsubscribeMessages=null,contactMode=false;
const SUPER_ADMIN="jonathanmentor62@gmail.com";
const DEFAULT_PHOTO="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><rect width="120" height="120" fill="#202c33"/><circle cx="60" cy="43" r="22" fill="#6b7c85"/><path d="M25 105c4-24 18-37 35-37s31 13 35 37" fill="#6b7c85"/></svg>`);
function safe(v){return String(v??"");}
function escapeHTML(v){return safe(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function photoUrl(url){if(typeof url==="string"&&(url.startsWith("http://")||url.startsWith("https://")))return url;return DEFAULT_PHOTO;}
function getMemberClass(m){return safe(m.class||m.studentClass||"").trim();}
function getMemberDetail(m){if(m.accountType==="student"){const c=getMemberClass(m),s=safe(m.stream).trim();if(c&&s)return c+" • "+s;if(c)return c;return"Student";}const d=safe(m.department).trim();return d?`Staff • ${d}`:"Staff";}
function renderMembers(){
 contactMode=false;sectionTitle.textContent="JDA NETWORK MEMBERS";
 const term=searchInput.value.trim().toLowerCase();
 let filtered=[...allMembers];
 if(currentFilter!=="all")filtered=filtered.filter(member=>{if(currentFilter==="student")return member.accountType==="student";if(currentFilter==="staff")return member.accountType==="staff";return getMemberClass(member)===currentFilter;});
 if(term)filtered=filtered.filter(member=>safe(member.realName).toLowerCase().includes(term)||safe(member.jdaNumber).toLowerCase().includes(term)||safe(member.department).toLowerCase().includes(term)||getMemberClass(member).toLowerCase().includes(term));
 if(!filtered.length){membersEl.innerHTML=`<div class="empty">No approved JDA Network members found.<br><small style="color:#8696a0">Found ${allMembers.length} total approved - try filter All</small></div>`;return;}
 membersEl.innerHTML=filtered.map(member=>{const name=safe(member.realName).trim()||"Unknown";const photo=photoUrl(member.photoURL||member.photoUrl||member.photo);return`<div class="member" data-uid="${escapeHTML(member.uid)}"><img src="${escapeHTML(photo)}" alt="" onerror="this.onerror=null;this.src='${DEFAULT_PHOTO}'"><div class="member-info"><div class="member-name">${escapeHTML(name)}</div><div class="member-detail">${escapeHTML(getMemberDetail(member))}</div></div><div class="status"></div></div>`;}).join("");
 membersEl.querySelectorAll(".member").forEach(el=>{el.addEventListener("click",function(){const uid=this.dataset.uid;const member=allMembers.find(item=>item.uid===uid);if(member)openChat(member);});});
}

// FIXED: LOAD FROM BOTH COLLECTIONS
async function loadMembers(){
 membersEl.innerHTML=`<div class="loading">Loading JDA Network members...<br><small>Checking users & members collections</small></div>`;
 try{
  // Try both collections - this is the fix!
  let usersSnap, membersSnap;
  try{ usersSnap=await getDocs(query(collection(db,"users"),where("status","==","approved"))); }catch(e){ console.warn("users query failed",e); usersSnap={docs:[]}; }
  try{ membersSnap=await getDocs(query(collection(db,"members"),where("status","==","approved"))); }catch(e){ console.warn("members query failed",e); membersSnap={docs:[]}; }
  
  console.log("users approved:", usersSnap.docs.length, "members approved:", membersSnap.docs.length);
  
  const uniqueMembers=new Map();
  [...usersSnap.docs, ...membersSnap.docs].forEach(item=>{
   const data=item.data();
   const uid=data.uid||item.id;
   const realName=safe(data.realName||data.fullName||data.displayName||data.username||data.name).trim();
   if(!realName) return;
   if(uniqueMembers.has(uid)) return;
   uniqueMembers.set(uid,{id:item.id,uid:uid,...data,realName:realName});
  });
  
  allMembers=Array.from(uniqueMembers.values());
  if(currentUser) allMembers=allMembers.filter(member=>member.uid!==currentUser.uid);
  allMembers.sort((a,b)=>safe(a.realName).localeCompare(safe(b.realName)));
  
  console.log("Total members to show:", allMembers.length);
  renderMembers();
 }catch(error){
  console.error("Member loading error:",error);
  membersEl.innerHTML=`<div class="error-box"><strong>Could not load members.</strong><br><br>${escapeHTML(error?.message||"Check Firestore Rules")}<br><br><small>Make sure Firestore Rules allow: allow read: if request.auth != null;</small></div>`;
 }
}

async function checkAdmin(){
 adminBtn.classList.add("hidden");
 if(!currentUser) return false;
 if(safe(currentUser.email).toLowerCase()===SUPER_ADMIN.toLowerCase()){adminBtn.classList.remove("hidden");return true;}
 try{const adminDoc=await getDoc(doc(db,"admins",currentUser.uid));if(adminDoc.exists()){adminBtn.classList.remove("hidden");return true;}}catch(e){}
 return false;
}
profileBtn.addEventListener("click",()=>{
 if(!currentProfile){alert("Profile still loading.");return;}
 myPhoto.src=photoUrl(currentProfile.photoURL);myPhoto.onerror=function(){this.onerror=null;this.src=DEFAULT_PHOTO;};
 myName.textContent=currentProfile.realName||"JDA Member";
 myInfo.innerHTML=`<strong>${escapeHTML(currentProfile.accountType==="student"?"Student":"Staff")}</strong><br>${escapeHTML(getMemberDetail(currentProfile))}<br>JDA Number: ${escapeHTML(currentProfile.jdaNumber||"")}<br>Email: ${escapeHTML(currentProfile.email||currentUser?.email||"")}`;
 profileModal.classList.add("open");
});
closeProfile.addEventListener("click",()=>profileModal.classList.remove("open"));
profileModal.addEventListener("click",e=>{if(e.target===profileModal)profileModal.classList.remove("open");});
logoutBtn.addEventListener("click",async()=>{try{await signOut(auth);window.location.href="./index.html";}catch(error){alert("Logout failed:\n\n"+error.message);}});
adminBtn.addEventListener("click",()=>{window.location.href="./admin.html";});
newChat.addEventListener("click",()=>{chatNav.classList.add("active");networkBtn.classList.remove("active");contactMode=false;renderMembers();searchInput.focus();});
function getConversationId(uid1,uid2){return[uid1,uid2].sort().join("_");}
async function openChat(member){
 if(!currentUser||!member||!member.uid) return;
 if(member.uid===currentUser.uid){alert("You cannot chat with yourself.");return;}
 currentChatUser=member;chatPhoto.src=photoUrl(member.photoURL);chatPhoto.onerror=function(){this.onerror=null;this.src=DEFAULT_PHOTO;};chatName.textContent=member.realName;chatStatus.textContent=getMemberDetail(member);chat.classList.add("open");messagesEl.innerHTML=`<div class="loading">Loading messages...</div>`;
 if(unsubscribeMessages){unsubscribeMessages();unsubscribeMessages=null;}
 const conversationId=getConversationId(currentUser.uid,member.uid);
 try{
  const conversationRef=doc(db,"conversations",conversationId);const conversationSnap=await getDoc(conversationRef);
  if(!conversationSnap.exists()){await setDoc(conversationRef,{participantIds:[currentUser.uid,member.uid],createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:""});}
  const messagesQuery=query(collection(db,"conversations",conversationId,"messages"),orderBy("createdAt","asc"));
  unsubscribeMessages=onSnapshot(messagesQuery,snapshot=>{
   if(snapshot.empty){messagesEl.innerHTML=`<div class="empty">No messages yet.<br>Send the first message.</div>`;return;}
   messagesEl.innerHTML="";snapshot.forEach(messageDoc=>{const message=messageDoc.data();const mine=message.senderId===currentUser.uid;const bubble=document.createElement("div");bubble.className="message "+(mine?"mine":"theirs");bubble.innerHTML=`<div>${escapeHTML(message.text)}</div><span class="message-time">${escapeHTML(message.createdAt?.toDate?message.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"")}</span>`;messagesEl.appendChild(bubble);});messagesEl.scrollTop=messagesEl.scrollHeight;
  },error=>{messagesEl.innerHTML=`<div class="error-box">Unable to load messages.<br><br>${escapeHTML(error.message||"Please try again.")}</div>`;});
  setTimeout(()=>messageInput.focus(),250);
 }catch(error){messagesEl.innerHTML=`<div class="error-box"><strong>Could not open this chat.</strong><br><br>${escapeHTML(error.message||"Please try again.")}</div>`;}
}
closeChat.addEventListener("click",()=>{chat.classList.remove("open");currentChatUser=null;if(unsubscribeMessages){unsubscribeMessages();unsubscribeMessages=null;}messageInput.value="";});
messageForm.addEventListener("submit",async event=>{
 event.preventDefault();if(!currentUser||!currentChatUser) return;const text=messageInput.value.trim();if(!text) return;const conversationId=getConversationId(currentUser.uid,currentChatUser.uid);messageInput.disabled=true;
 try{
  const conversationRef=doc(db,"conversations",conversationId);const conversationSnap=await getDoc(conversationRef);
  if(!conversationSnap.exists()){await setDoc(conversationRef,{participantIds:[currentUser.uid,currentChatUser.uid],createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:""});}
  await addDoc(collection(db,"conversations",conversationId,"messages"),{senderId:currentUser.uid,receiverId:currentChatUser.uid,text:text,createdAt:serverTimestamp()});
  await setDoc(conversationRef,{updatedAt:serverTimestamp(),lastMessage:text},{merge:true});messageInput.value="";
 }catch(error){alert("Message could not be sent.\n\n"+(error.message||""));}finally{messageInput.disabled=false;messageInput.focus();}
});
filters.forEach(button=>{button.addEventListener("click",()=>{filters.forEach(item=>{item.classList.remove("active");});button.classList.add("active");currentFilter=button.dataset.filter;renderMembers();});});
searchInput.addEventListener("input",()=>{if(contactMode){contactMode=false;networkBtn.classList.remove("active");chatNav.classList.add("active");}renderMembers();});
networkBtn.addEventListener("click",()=>{networkBtn.classList.add("active");chatNav.classList.remove("active");alert("Network: Coming soon - contacts integration");});
chatNav.addEventListener("click",()=>{chatNav.classList.add("active");networkBtn.classList.remove("active");contactMode=false;renderMembers();});
onAuthStateChanged(auth,async user=>{
 if(!user){currentUser=null;currentProfile=null;startup.classList.remove("hidden");startupText.textContent="You are not logged in.";startupButton.classList.remove("hidden");startupButton.textContent="Go to Login";startupButton.onclick=()=>{window.location.href="./index.html";};return;}
 currentUser=user;
 try{
  const profileDoc=await getDoc(doc(db,"users",user.uid));
  if(!profileDoc.exists()){startup.classList.remove("hidden");startupText.textContent="Your JDA Networks profile could not be found.";startupButton.classList.remove("hidden");startupButton.textContent="Go to Login";startupButton.onclick=()=>{window.location.href="./index.html";};return;}
  currentProfile={id:profileDoc.id,...profileDoc.data()};
  if(currentProfile.status!=="approved"){startup.classList.remove("hidden");startupText.textContent=currentProfile.status==="pending"?"Your registration is still waiting for admin approval.":"Your JDA Networks account is not approved.";startupButton.classList.remove("hidden");startupButton.textContent="Back to Login";startupButton.onclick=()=>{window.location.href="./index.html";};return;}
  startup.classList.add("hidden");await checkAdmin();await loadMembers();
 }catch(error){startup.classList.remove("hidden");startupText.textContent="JDA Networks could not start: "+(error.message||"");startupButton.classList.remove("hidden");startupButton.textContent="Refresh";startupButton.onclick=()=>{location.reload();};}
});
</script>
</body>
</html>
