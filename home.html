<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JDA Networks</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b141a;
  color:#fff;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.hidden{
  display:none!important;
}

.header{
  height:64px;
  background:#202c33;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.brand-title{
  font-size:18px;
  font-weight:bold;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#374952;
  color:white;
  font-size:18px;
}

.container{
  max-width:900px;
  margin:auto;
  padding-bottom:90px;
}

.search{
  padding:12px;
}

.search input{
  width:100%;
  padding:13px 17px;
  border:0;
  outline:0;
  border-radius:25px;
  background:#202c33;
  color:white;
  font-size:14px;
}

.search input::placeholder{
  color:#8696a0;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 12px 12px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  white-space:nowrap;
  padding:9px 15px;
  border-radius:18px;
  background:#202c33;
  color:#aebac1;
  font-size:13px;
}

.filter.active{
  background:#25d366;
  color:#07130b;
}

.section{
  padding:10px 15px;
  color:#8696a0;
  font-size:13px;
  font-weight:bold;
}

.member{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px 15px;
  border-bottom:1px solid #202c33;
  cursor:pointer;
}

.member:active{
  background:#202c33;
}

.member img{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:#202c33;
}

.member-info{
  flex:1;
  min-width:0;
}

.member-name{
  font-weight:bold;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.member-detail{
  color:#8696a0;
  font-size:12px;
  margin-top:4px;
}

.status{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#25d366;
  flex-shrink:0;
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:#667781;
  font-size:14px;
}

.loading{
  text-align:center;
  padding:35px 20px;
  color:#8696a0;
}

.error-box{
  margin:20px 15px;
  padding:14px;
  border-radius:12px;
  background:#3b2024;
  color:#ff9b9b;
  font-size:13px;
  line-height:1.5;
}

.contact-info{
  margin:10px 15px 18px;
  padding:15px;
  background:#202c33;
  border-radius:15px;
  color:#aebac1;
  font-size:13px;
  line-height:1.5;
}

.contact-title{
  color:#fff;
  font-size:16px;
  font-weight:bold;
  margin-bottom:6px;
}

.contact-button{
  display:block;
  width:calc(100% - 30px);
  margin:10px 15px;
  padding:13px;
  border-radius:25px;
  background:#25d366;
  color:#07130b;
  font-weight:bold;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#202c33;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav{
  background:none;
  color:#8696a0;
  font-size:11px;
  text-align:center;
  min-width:75px;
}

.nav span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.nav.active{
  color:#25d366;
}

.new-chat{
  position:fixed;
  right:20px;
  bottom:82px;
  width:55px;
  height:55px;
  border-radius:18px;
  background:#25d366;
  color:#07130b;
  font-size:25px;
  z-index:15;
}

/* CHAT */

.chat{
  display:none;
  position:fixed;
  inset:0;
  background:#0b141a;
  z-index:50;
}

.chat-header{
  height:64px;
  background:#202c33;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
}

.back{
  background:none;
  color:white;
  font-size:25px;
  padding:5px 8px;
}

.chat-header img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.chat-user{
  flex:1;
  min-width:0;
}

.chat-user strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-user small{
  color:#8696a0;
}

.messages{
  position:absolute;
  top:64px;
  bottom:65px;
  left:0;
  right:0;
  overflow-y:auto;
  padding:15px 10px 20px;
  background:#0b141a;
}

.message{
  max-width:78%;
  padding:9px 12px;
  margin:5px 0;
  border-radius:9px;
  font-size:14px;
  line-height:1.35;
  word-wrap:break-word;
}

.message.mine{
  margin-left:auto;
  background:#005c4b;
}

.message.theirs{
  margin-right:auto;
  background:#202c33;
}

.message-time{
  display:block;
  color:#b2c0c8;
  font-size:9px;
  text-align:right;
  margin-top:4px;
}

.message-form{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#202c33;
  display:flex;
  gap:8px;
  align-items:center;
  padding:8px;
}

.message-form input{
  flex:1;
  border:0;
  outline:0;
  border-radius:24px;
  background:#111b21;
  color:white;
  padding:13px 16px;
}

.send{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#25d366;
  color:#07130b;
  font-size:18px;
}

/* PROFILE */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:80;
  align-items:flex-end;
  justify-content:center;
}

.modal-card{
  width:100%;
  max-width:600px;
  background:#202c33;
  border-radius:20px 20px 0 0;
  padding:25px;
  max-height:85vh;
  overflow-y:auto;
}

.profile-center{
  text-align:center;
}

.profile-center img{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  background:#111b21;
}

.profile-name{
  font-size:21px;
  font-weight:bold;
  margin-top:12px;
}

.profile-info{
  color:#8696a0;
  margin-top:8px;
  line-height:1.5;
}

.close{
  width:100%;
  margin-top:20px;
  padding:13px;
  border-radius:25px;
  background:#374952;
  color:white;
}

.logout{
  width:100%;
  margin-top:10px;
  padding:13px;
  border-radius:25px;
  background:#3b2024;
  color:#ff9b9b;
  font-weight:bold;
}
</style>

<script type="module">

/* =========================
   FIREBASE
========================= */

import {
  auth,
  db
} from "./firebase.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  collection,
  query,
  where,
  getDocs,
  getDoc,
  doc,
  setDoc,
  addDoc,
  onSnapshot,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   ELEMENTS
========================= */

const membersEl =
  document.getElementById("members");

const searchInput =
  document.getElementById("searchInput");

const filters =
  document.querySelectorAll(".filter");

const sectionTitle =
  document.getElementById("sectionTitle");

const adminBtn =
  document.getElementById("adminBtn");

const profileBtn =
  document.getElementById("profileBtn");

const profileModal =
  document.getElementById("profileModal");

const closeProfile =
  document.getElementById("closeProfile");

const logoutBtn =
  document.getElementById("logoutBtn");

const myPhoto =
  document.getElementById("myPhoto");

const myName =
  document.getElementById("myName");

const myInfo =
  document.getElementById("myInfo");

const newChat =
  document.getElementById("newChat");

const networkBtn =
  document.getElementById("networkBtn");

const chatNav =
  document.getElementById("chatNav");

const chat =
  document.getElementById("chat");

const closeChat =
  document.getElementById("closeChat");

const chatPhoto =
  document.getElementById("chatPhoto");

const chatName =
  document.getElementById("chatName");

const chatStatus =
  document.getElementById("chatStatus");

const messagesEl =
  document.getElementById("messages");

const messageForm =
  document.getElementById("messageForm");

const messageInput =
  document.getElementById("messageInput");


/* =========================
   STATE
========================= */

let currentUser = null;
let currentProfile = null;
let allMembers = [];
let currentFilter = "all";
let currentChatUser = null;
let unsubscribeMessages = null;
let contactMode = false;


/* =========================
   DEFAULT PHOTO
========================= */

const DEFAULT_PHOTO =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg"
         width="120"
         height="120"
         viewBox="0 0 120 120">
      <rect width="120" height="120" fill="#202c33"/>
      <circle cx="60" cy="43" r="22" fill="#6b7c85"/>
      <path d="M25 105c4-24 18-37 35-37s31 13 35 37"
            fill="#6b7c85"/>
    </svg>
  `);


/* =========================
   HELPERS
========================= */

function safe(value){
  return String(value ?? "");
}


function escapeHTML(value){

  return safe(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function photoUrl(url){

  return url && url.startsWith("http")
    ? url
    : DEFAULT_PHOTO;

}


/*
  Convert phone numbers into one
  standard format.

  Examples:

  +256 771 234 567
  0771 234 567
  256771234567

  all become:

  256771234567
*/

function normalizePhone(number){

  if(!number){
    return "";
  }

  let digits =
    String(number)
      .replace(/\D/g,"");


  if(digits.startsWith("00")){
    digits =
      digits.substring(2);
  }


  if(digits.startsWith("0") &&
     digits.length === 10){

    digits =
      "256" + digits.substring(1);

  }


  if(
    digits.startsWith("256") &&
    digits.length >= 12
  ){

    return digits;
  }


  return digits;
}


/* =========================
   MEMBER PHONE MATCH
========================= */

function memberPhone(member){

  return normalizePhone(
    member.jdaNumber
  );

}


/* =========================
   FORMAT TIME
========================= */

function formatTime(timestamp){

  if(!timestamp){
    return "";
  }

  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch{

    return "";

  }

}


/* =========================
   RENDER MEMBERS
========================= */

function renderMembers(){

  contactMode = false;

  sectionTitle.textContent =
    "JDA NETWORK MEMBERS";


  const term =
    searchInput.value
      .trim()
      .toLowerCase();


  let filtered =
    [...allMembers];


  if(currentFilter !== "all"){

    filtered =
      filtered.filter(member => {

        if(currentFilter === "student"){
          return member.accountType === "student";
        }

        if(currentFilter === "staff"){
          return member.accountType === "staff";
        }

        return member.class === currentFilter;

      });

  }


  if(term){

    filtered =
      filtered.filter(member => {

        return (
          safe(member.realName)
            .toLowerCase()
            .includes(term)

          ||

          safe(member.jdaNumber)
            .toLowerCase()
            .includes(term)

          ||

          safe(member.email)
            .toLowerCase()
            .includes(term)

          ||

          safe(member.department)
            .toLowerCase()
            .includes(term)
        );

      });

  }


  if(!filtered.length){

    membersEl.innerHTML = `
      <div class="empty">
        No approved JDA Network members found.
      </div>
    `;

    return;

  }


  membersEl.innerHTML =
    filtered.map(member => {

      let detail = "";

      if(member.accountType === "student"){

        detail =
          `${safe(member.class)} • ${safe(member.stream)}`;

      }else{

        detail =
          `Staff • ${safe(member.department)}`;

      }


      return `
        <div
          class="member"
          data-uid="${escapeHTML(member.uid)}"
        >

          <img
            src="${escapeHTML(
              photoUrl(member.photoURL)
            )}"
            alt=""
          >

          <div class="member-info">

            <div class="member-name">
              ${escapeHTML(member.realName)}
            </div>

            <div class="member-detail">
              ${escapeHTML(detail)}
            </div>

          </div>

          <div class="status"></div>

        </div>
      `;

    }).join("");


  membersEl
    .querySelectorAll(".member")
    .forEach(element => {

      element.addEventListener(
        "click",
        function(){

          const uid =
            this.dataset.uid;

          const member =
            allMembers.find(
              item => item.uid === uid
            );

          if(member){
            openChat(member);
          }

        }
      );

    });

}


/* =========================
   LOAD MEMBERS
========================= */

async function loadMembers(){

  membersEl.innerHTML = `
    <div class="loading">
      Loading JDA Network members...
    </div>
  `;


  try{

    const usersQuery =
      query(
        collection(db,"users"),
        where("status","==","approved")
      );


    const snapshot =
      await getDocs(usersQuery);


    allMembers =
      snapshot.docs.map(item => ({
        id:item.id,
        ...item.data()
      }));


    allMembers.sort(
      (a,b) =>
        safe(a.realName)
          .localeCompare(
            safe(b.realName)
          )
    );


    renderMembers();

  }catch(error){

    console.error(
      "Member loading error:",
      error
    );


    membersEl.innerHTML = `
      <div class="error-box">
        <strong>
          Could not load JDA Network members.
        </strong>
        <br><br>
        ${escapeHTML(
          error?.message ||
          "Check your Firebase connection."
        )}
      </div>
    `;

  }

}


/* =====================================================
   CONTACT PICKER
===================================================== */

/*
  This uses the Android/browser Contact Picker API.

  The user must press Network first.

  The browser then opens the phone contacts.
*/

async function openPhoneContacts(){

  contactMode = true;

  networkBtn.classList.add("active");
  chatNav.classList.remove("active");

  sectionTitle.textContent =
    "JDA MEMBERS IN YOUR CONTACTS";


  membersEl.innerHTML = `
    <div class="loading">
      Opening your phone contacts...
    </div>
  `;


  /*
    Check browser support.
  */

  if(
    !("contacts" in navigator) ||
    !navigator.contacts ||
    !navigator.contacts.select
  ){

    membersEl.innerHTML = `
      <div class="error-box">

        <strong>
          Contact access is not supported here.
        </strong>

        <br><br>

        Please open JDA Networks in
        <strong>Google Chrome on Android</strong>
        and press Network again.

      </div>
    `;

    return;

  }


  try{

    /*
      Open Android/browser contact picker.

      We request:
      - name
      - phone number

      Multiple contacts can be selected.
    */

    const contacts =
      await navigator.contacts.select(
        ["name","tel"],
        {
          multiple:true
        }
      );


    /*
      User cancelled.
    */

    if(!contacts || !contacts.length){

      membersEl.innerHTML = `
        <div class="empty">
          No contacts were selected.
        </div>
      `;

      return;

    }


    /*
      Collect every selected phone number.
    */

    const selectedPhones =
      new Set();


    contacts.forEach(contact => {

      if(!contact.tel){
        return;
      }


      contact.tel.forEach(number => {

        const normalized =
          normalizePhone(number);


        if(normalized){

          selectedPhones.add(
            normalized
          );

        }

      });

    });


    /*
      Compare selected phone numbers
      with approved JDA members.
    */

    const matches =
      allMembers.filter(member => {

        const jdaPhone =
          memberPhone(member);


        if(!jdaPhone){
          return false;
        }


        return selectedPhones.has(
          jdaPhone
        );

      });


    /*
      Display results.
    */

    renderContactMatches(
      matches,
      contacts.length
    );


  }catch(error){

    console.error(
      "Contact picker error:",
      error
    );


    /*
      User cancelled the picker.
    */

    if(
      error?.name ===
      "AbortError"
    ){

      membersEl.innerHTML = `
        <div class="empty">
          Contact selection cancelled.
        </div>
      `;

      return;

    }


    membersEl.innerHTML = `
      <div class="error-box">

        <strong>
          Could not access contacts.
        </strong>

        <br><br>

        ${escapeHTML(
          error?.message ||
          "Please try again."
        )}

      </div>
    `;

  }

}


/* =========================
   RENDER CONTACT MATCHES
========================= */

function renderContactMatches(
  matches,
  selectedCount
){

  sectionTitle.textContent =
    "JDA MEMBERS IN YOUR CONTACTS";


  if(!matches.length){

    membersEl.innerHTML = `

      <div class="contact-info">

        <div class="contact-title">
          No JDA members found
        </div>

        You selected
        ${selectedCount}
        contact${selectedCount === 1 ? "" : "s"},
