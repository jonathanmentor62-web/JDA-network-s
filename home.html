<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JDA Networks</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b141a;
  color:white;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.header{
  height:64px;
  background:#202c33;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.brand-title{
  font-size:18px;
  font-weight:bold;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#374952;
  color:white;
  font-size:18px;
}

.container{
  max-width:900px;
  margin:auto;
  padding-bottom:80px;
}

.search{
  padding:12px;
}

.search input{
  width:100%;
  padding:13px 17px;
  border:0;
  outline:0;
  border-radius:25px;
  background:#202c33;
  color:white;
}

.search input::placeholder{
  color:#8696a0;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 12px 12px;
}

.filter{
  white-space:nowrap;
  padding:8px 15px;
  border-radius:18px;
  background:#202c33;
  color:#aebac1;
}

.filter.active{
  background:#25d366;
  color:#07130b;
}

.section{
  padding:10px 15px;
  color:#8696a0;
  font-size:13px;
  font-weight:bold;
}

.member{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px 15px;
  border-bottom:1px solid #202c33;
  cursor:pointer;
}

.member:hover{
  background:#202c33;
}

.member img{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
}

.member-info{
  flex:1;
  min-width:0;
}

.member-name{
  font-weight:bold;
  font-size:15px;
}

.member-detail{
  color:#8696a0;
  font-size:12px;
  margin-top:4px;
}

.status{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#25d366;
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:#667781;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#202c33;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav{
  background:none;
  color:#8696a0;
  font-size:11px;
  text-align:center;
}

.nav span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.nav.active{
  color:#25d366;
}

.new-chat{
  position:fixed;
  right:20px;
  bottom:82px;
  width:55px;
  height:55px;
  border-radius:18px;
  background:#25d366;
  color:#07130b;
  font-size:25px;
  z-index:15;
}

/* CHAT */

.chat{
  display:none;
  position:fixed;
  inset:0;
  background:#0b141a;
  z-index:50;
}

.chat-header{
  height:64px;
  background:#202c33;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
}

.back{
  background:none;
  color:white;
  font-size:25px;
  padding:5px;
}

.chat-header img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
}

.chat-user{
  flex:1;
}

.chat-user strong{
  display:block;
}

.chat-user small{
  color:#8696a0;
}

.messages{
  position:absolute;
  top:64px;
  bottom:65px;
  left:0;
  right:0;
  overflow-y:auto;
  padding:15px 10px 20px;
  background:#0b141a;
}

.message{
  max-width:78%;
  padding:9px 12px;
  margin:5px 0;
  border-radius:9px;
  font-size:14px;
  line-height:1.35;
  word-wrap:break-word;
}

.message.mine{
  margin-left:auto;
  background:#005c4b;
}

.message.theirs{
  margin-right:auto;
  background:#202c33;
}

.message-time{
  display:block;
  color:#8696a0;
  font-size:9px;
  text-align:right;
  margin-top:4px;
}

.message-form{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#202c33;
  display:flex;
  gap:8px;
  align-items:center;
  padding:8px;
}

.message-form input{
  flex:1;
  border:0;
  outline:0;
  border-radius:24px;
  background:#111b21;
  color:white;
  padding:13px 16px;
}

.send{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#25d366;
  color:#07130b;
  font-size:18px;
}

/* PROFILE */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:80;
  align-items:flex-end;
  justify-content:center;
}

.modal-card{
  width:100%;
  max-width:600px;
  background:#202c33;
  border-radius:20px 20px 0 0;
  padding:25px;
}

.profile-center{
  text-align:center;
}

.profile-center img{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
}

.profile-name{
  font-size:21px;
  font-weight:bold;
  margin-top:12px;
}

.profile-info{
  color:#8696a0;
  margin-top:8px;
}

.close{
  width:100%;
  margin-top:20px;
  padding:13px;
  border-radius:25px;
  background:#374952;
  color:white;
}

@media(min-width:700px){
  .bottom{
    left:50%;
    transform:translateX(-50%);
    max-width:900px;
  }

  .new-chat{
    right:30px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

  <div class="brand">

    <img
      src="./logo.png"
      onerror="this.style.display='none'"
    >

    <div class="brand-title">
      JDA Networks
    </div>

  </div>

  <div class="header-buttons">

    <button
      class="icon-btn"
      id="adminBtn"
      style="display:none"
    >
      🛡️
    </button>

    <button
      class="icon-btn"
      id="profileBtn"
    >
      👤
    </button>

  </div>

</header>


<!-- MAIN -->

<main class="container">

  <div class="search">

    <input
      id="searchInput"
      type="text"
      placeholder="Search JDA Networks"
    >

  </div>


  <div class="filters">

    <button class="filter active" data-filter="all">
      All
    </button>

    <button class="filter" data-filter="student">
      Students
    </button>

    <button class="filter" data-filter="staff">
      Staff
    </button>

    <button class="filter" data-filter="Form One">
      Form One
    </button>

    <button class="filter" data-filter="Form Two">
      Form Two
    </button>

    <button class="filter" data-filter="Form Three">
      Form Three
    </button>

    <button class="filter" data-filter="Form Four">
      Form Four
    </button>

    <button class="filter" data-filter="Form Five">
      Form Five
    </button>

    <button class="filter" data-filter="Form Six">
      Form Six
    </button>

  </div>


  <div class="section">
    JDA NETWORK MEMBERS
  </div>

  <div id="members"></div>

</main>


<!-- NEW CHAT -->

<button class="new-chat" id="newChat">
  ✎
</button>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <button class="nav active">
    <span>💬</span>
    Chats
  </button>

  <button class="nav" id="networkBtn">
    <span>👥</span>
