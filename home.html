<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta
    name="theme-color"
    content="#070914"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <title>jChat</title>

  <style>
    /* =========================================================
       JCHAT
       PREMIUM WHATSAPP-STYLE NEON INTERFACE
       ========================================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050711;
      color: #ffffff;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      position: relative;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      outline: 0;
      cursor: pointer;
    }

    /* =========================================================
       LIVE ELECTRICAL NETWORK
       ========================================================= */

    #networkCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(33, 58, 145, 0.15),
          transparent 42%
        ),
        #050711;
    }

    .networkGlow {
      position: fixed;
      inset: -20%;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 15% 25%,
          rgba(0, 153, 255, 0.12),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 35%,
          rgba(177, 0, 255, 0.13),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(68, 41, 255, 0.12),
          transparent 35%
        );
      filter: blur(35px);
      animation: ambientGlow 7s ease-in-out infinite alternate;
    }

    @keyframes ambientGlow {
      from {
        transform: scale(0.96);
        opacity: 0.65;
      }

      to {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    /* =========================================================
       APPLICATION SHELL
       ========================================================= */

    #jchatApp {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phoneShell {
      position: relative;
      width: min(100%, 520px);
      height: 100%;
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          rgba(9, 11, 25, 0.96),
          rgba(6, 8, 19, 0.97)
        );
    }

    @media (min-width: 600px) {
      .phoneShell {
        height: min(900px, 96vh);
        border-radius: 32px;
        border: 1px solid rgba(132, 93, 255, 0.3);
        box-shadow:
          0 0 25px rgba(0, 136, 255, 0.18),
          0 0 80px rgba(154, 45, 255, 0.12),
          inset 0 0 35px rgba(72, 73, 255, 0.06);
      }
    }

    /* =========================================================
       TOP HEADER
       ========================================================= */

    .topHeader {
      position: relative;
      z-index: 20;
      height: 86px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding:
        max(12px, env(safe-area-inset-top))
        15px
        10px
        15px;

      background:
        linear-gradient(
          180deg,
          rgba(4, 6, 15, 0.98),
          rgba(7, 9, 21, 0.9)
        );

      border-bottom: 1px solid rgba(83, 112, 255, 0.18);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.25);
    }

    .brand {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brandLogo {
      position: relative;
      width: 45px;
      height: 45px;
      flex: 0 0 45px;
      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #15aaff,
          #6b46ff 55%,
          #d62bff
        );

      box-shadow:
        0 0 10px rgba(0, 170, 255, 0.7),
        0 0 25px rgba(143, 43, 255, 0.45);

      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .brandLogo::before,
    .brandLogo::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(255,255,255,0.8);
      transform: rotate(45deg);
    }

    .brandLogo::before {
      left: 7px;
      top: 7px;
    }

    .brandLogo::after {
      right: 7px;
      bottom: 7px;
    }

    .brandLogoText {
      position: relative;
      z-index: 2;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brandName {
      min-width: 0;
      white-space: nowrap;
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -1.2px;

      background:
        linear-gradient(
          90deg,
          #ffffff 0%,
          #66baff 43%,
          #c75dff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 0 20px rgba(71, 148, 255, 0.18);
    }

    .headerActions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .headerButton {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: transparent;
      color: #e8ebff;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.2s ease;
    }

    .headerButton:hover,
    .headerButton:active {
      background: rgba(93, 101, 255, 0.12);
      box-shadow:
        0 0 14px rgba(79, 153, 255, 0.18);
    }

    .headerButton svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .videoHeaderButton {
      color: #be62ff;
    }

    /* =========================================================
       MAIN CONTENT
       ========================================================= */

    .mainContent {
      position: absolute;
      z-index: 10;
      top: 86px;
      left: 0;
      right: 0;
      bottom: 74px;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 20px;

      scrollbar-width: none;
      display: none;
    }

    .screen::-webkit-scrollbar {
      display: none;
    }

    .screen.active {
      display: block;
      animation: screenIn 0.2s ease;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       SECTION LABEL
       ========================================================= */

    .sectionHeader {
      padding: 17px 18px 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sectionTitle {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border-radius: 9px;

      background:
        linear-gradient(
          135deg,
          rgba(170, 55, 255, 0.22),
          rgba(35, 123, 255, 0.12)
        );

      border: 1px solid rgba(191, 83, 255, 0.3);

      color: #df8cff;
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0.5px;

      box-shadow:
        0 0 15px rgba(170, 55, 255, 0.1);
    }

    /* =========================================================
       SEARCH
       ========================================================= */

    .searchWrap {
      padding: 8px 15px 5px;
    }

    .searchBox {
      height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border-radius: 15px;

      background:
        rgba(15, 18, 36, 0.9);

      border: 1px solid rgba(87, 106, 255, 0.2);

      box-shadow:
        inset 0 0 20px rgba(33, 62, 150, 0.05);
    }

    .searchBox svg {
      width: 20px;
      height: 20px;
      stroke: #8195ff;
      fill: none;
      stroke-width: 2;
    }

    .searchBox input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 15px;
    }

    .searchBox input::placeholder {
      color: #7f849e;
    }

    /* =========================================================
       CHAT LIST
       ========================================================= */

    .chatList {
      padding: 4px 12px;
    }

    .chatItem {
      position: relative;
      min-height: 82px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px;

      border-bottom: 1px solid rgba(83, 103, 210, 0.14);

      transition: 0.18s ease;
    }

    .chatItem:active {
      background:
        linear-gradient(
          90deg,
          rgba(39, 87, 255, 0.09),
          rgba(170, 47, 255, 0.07)
        );
    }

    .avatar {
      position: relative;
      width: 57px;
      height: 57px;
      flex: 0 0 57px;
      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #176cff,
          #7e35ff 55%,
          #d52cff
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: 800;

      box-shadow:
        0 0 13px rgba(55, 122, 255, 0.35),
        0 0 23px rgba(174, 40, 255, 0.2);

      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .onlineDot {
      position: absolute;
      right: 1px;
      bottom: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;

      background: #57f29c;

      border: 2px solid #0a0d1b;

      box-shadow:
        0 0 9px rgba(72, 255, 157, 0.85);
    }

    .chatInfo {
      min-width: 0;
      flex: 1;
    }

    .chatTop {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .chatName {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
    }

    .chatTime {
      color: #9096b0;
      font-size: 11px;
      white-space: nowrap;
    }

    .chatBottom {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lastMessage {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: #aeb2c8;
      font-size: 13px;
    }

    .unreadBadge {
      min-width: 23px;
      height: 23px;
      padding: 0 6px;
      border-radius: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #6837ff,
          #b92eff
        );

      color: white;
      font-size: 11px;
      font-weight: 850;

      box-shadow:
        0 0 12px rgba(158, 47, 255, 0.5);
    }

    /* =========================================================
       EMPTY STATE
       ========================================================= */

    .emptyState {
      padding: 65px 25px;
      text-align: center;
      color: #8c91aa;
    }

    .emptyIcon {
      width: 65px;
      height: 65px;
      margin: 0 auto 15px;
      border-radius: 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        linear-gradient(
          135deg,
          rgba(29, 120, 255, 0.15),
          rgba(180, 44, 255, 0.14)
        );

      border: 1px solid rgba(110, 102, 255, 0.25);

      box-shadow:
        0 0 25px rgba(73, 92, 255, 0.1);
    }

    .emptyIcon svg {
      width: 30px;
      height: 30px;
      stroke: #9e75ff;
      fill: none;
      stroke-width: 1.8;
    }

    .emptyTitle {
      color: white;
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .emptyText {
      font-size: 13px;
      line-height: 1.5;
    }

    /* =========================================================
       UPDATES
       ========================================================= */

    .statusCard {
      margin: 10px 15px;
      padding: 15px;
      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(25, 30, 63, 0.86),
          rgba(18, 15, 42, 0.86)
        );

      border: 1px solid rgba(96, 110, 255, 0.2);

      box-shadow:
        0 0 22px rgba(52, 82, 255, 0.08);
    }

    .statusRow {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .statusAvatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      padding: 2px;

      background:
        conic-gradient(
          #20aaff,
          #c331ff,
          #20aaff
        );
    }

    .statusAvatarInner {
      width: 100%;
      height: 100%;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111427;
      font-weight: 800;
    }

    .statusName {
      font-weight: 800;
      font-size: 15px;
    }

    .statusTime {
      margin-top: 4px;
      color: #8e94ae;
      font-size: 12px;
    }

    /* =========================================================
       CONTACTS
       ========================================================= */

    .contactList {
      padding: 8px 14px;
    }

    .contactItem {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 6px;
      border-bottom: 1px solid rgba(80, 99, 210, 0.12);
    }

    .contactInfo {
      flex: 1;
      min-width: 0;
    }

    .contactName {
      color: white;
      font-size: 15px;
      font-weight: 750;
    }

    .contactAbout {
      color: #8d93ac;
      font-size: 12px;
      margin-top: 3px;
    }

    /* =========================================================
       CALLS
       ========================================================= */

    .callItem {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 16px;

      border-bottom: 1px solid rgba(81, 100, 211, 0.13);
    }

    .callDetails {
      flex: 1;
      min-width: 0;
    }

    .callName {
      font-size: 15px;
      font-weight: 750;
    }

    .callMeta {
      margin-top: 4px;
      color: #8c92aa;
      font-size: 12px;
    }

    .callAction {
      width: 43px;
      height: 43px;
      border-radius: 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #8fb5ff;
      background: rgba(51, 103, 255, 0.1);

      border: 1px solid rgba(76, 123, 255, 0.2);
    }

    .callAction svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* =========================================================
       PROFILE
       ========================================================= */

    .profileHeader {
      padding: 28px 20px 22px;
      text-align: center;

      background:
        radial-gradient(
          circle at center,
          rgba(76, 73, 255, 0.12),
          transparent 60%
        );
    }

    .profileAvatar {
      width: 100px;
      height: 100px;
      margin: 0 auto 13px;
      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #009dff,
          #7a42ff,
          #d92bff
        );

      padding: 3px;

      box-shadow:
        0 0 25px rgba(91, 98, 255, 0.35);
    }

    .profileAvatarInner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #111427;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 28px;
      font-weight: 850;
    }

    .profileName {
      font-size: 21px;
      font-weight: 850;
    }

    .profileAbout {
      margin-top: 5px;
      color: #9197b1;
      font-size: 13px;
    }

    .settingsList {
      margin: 10px 14px;
      border-radius: 18px;
      overflow: hidden;

      background: rgba(13, 16, 33, 0.82);
      border: 1px solid rgba(90, 107, 255, 0.15);
    }

    .settingItem {
      width: 100%;
      min-height: 57px;
      padding: 10px 14px;

      display: flex;
      align-items: center;
      gap: 13px;

      color: white;
      background: transparent;
      text-align: left;

      border-bottom: 1px solid rgba(76, 94, 195, 0.1);
    }

    .settingItem:last-child {
      border-bottom: 0;
    }

    .settingIcon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          rgba(37, 122, 255, 0.14),
          rgba(173, 46, 255, 0.13)
        );

      color: #9e8cff;
    }

    .settingIcon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    .settingText {
      flex: 1;
    }

    .settingTitle {
      font-size: 14px;
      font-weight: 700;
    }

    .settingSub {
      color: #858ba5;
      font-size: 11px;
      margin-top: 3px;
    }

    /* =========================================================
       CHAT WINDOW
       ========================================================= */

    #chatWindow {
      position: absolute;
      inset: 0;
      z-index: 50;

      display: none;
      flex-direction: column;

      background:
        linear-gradient(
          180deg,
          rgba(6, 8, 18, 0.98),
          rgba(5, 7, 16, 0.98)
        );
    }

    #chatWindow.open {
      display: flex;
      animation: chatOpen 0.22s ease;
    }

    @keyframes chatOpen {
      from {
        opacity: 0;
        transform: translateX(20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .chatHeader {
      height: 73px;
      flex: 0 0 73px;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px 9px;

      background:
        rgba(7, 9, 20, 0.97);

      border-bottom: 1px solid rgba(86, 105, 255, 0.17);
    }

    .backButton {
      width: 40px;
      height: 40px;
      border-radius: 12px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #8fbaff;
      background: transparent;
    }

    .backButton svg {
      width: 25px;
      height: 25px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .chatHeaderAvatar {
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #176cff,
          #a02fff
        );

      font-weight: 800;
      overflow: hidden;
    }

    .chatHeaderAvatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chatHeaderInfo {
      flex: 1;
      min-width: 0;
    }

    .chatHeaderName {
      font-size: 15px;
      font-weight: 800;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .chatHeaderStatus {
      color: #61b4ff;
      font-size: 11px;
      margin-top: 3px;
    }

    .chatHeaderActions {
      display: flex;
      gap: 1px;
    }

    .chatHeaderButton {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: transparent;
      color: #b0b8dc;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chatHeaderButton svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* =========================================================
       MESSAGES
       ========================================================= */

    .messagesArea {
      position: relative;
      flex: 1;
      overflow-y: auto;
      padding: 18px 12px 10px;

      scrollbar-width: none;

      background:
        radial-gradient(
          circle at 10% 20%,
          rgba(0, 110, 255, 0.045),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 60%,
          rgba(183, 36, 255, 0.05),
          transparent 25%
        );
    }

    .messagesArea::-webkit-scrollbar {
      display: none;
    }

    .messageRow {
      display: flex;
      margin: 5px 0;
    }

    .messageRow.incoming {
      justify-content: flex-start;
    }

    .messageRow.outgoing {
      justify-content: flex-end;
    }

    .messageBubble {
      position: relative;
      max-width: 79%;
      padding: 10px 13px 7px;
      border-radius: 17px;

      font-size: 14px;
      line-height: 1.38;
      word-wrap: break-word;
    }

    .incoming .messageBubble {
      background:
        linear-gradient(
          135deg,
          rgba(20, 43, 87, 0.94),
          rgba(19, 25, 54, 0.96)
        );

      border: 1px solid rgba(44, 148, 255, 0.55);

      border-bottom-left-radius: 5px;

      box-shadow:
        0 0 14px rgba(27, 141, 255, 0.12),
        inset 0 0 15px rgba(38, 122, 255, 0.04);
    }

    .outgoing .messageBubble {
      background:
        linear-gradient(
          135deg,
          #6335d9,
          #9d2cf2
        );

      border: 1px solid rgba(207, 115, 255, 0.58);

      border-bottom-right-radius: 5px;

      box-shadow:
        0 0 18px rgba(163, 47, 255, 0.28);
    }

    .messageText {
      color: #f5f5ff;
      white-space: pre-wrap;
    }

    .messageMeta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      margin-top: 3px;

      color: rgba(255,255,255,0.58);
      font-size: 9px;
    }

    .seenTicks {
      color: #7dc9ff;
      font-size: 11px;
      letter-spacing: -3px;
      margin-right: 2px;
    }

    .typingIndicator {
      display: none;
      width: fit-content;
      padding: 10px 13px;
      border-radius: 17px;
      background: rgba(24, 36, 69, 0.9);
      border: 1px solid rgba(45, 141, 255, 0.35);
    }

    .typingIndicator.show {
      display: flex;
      gap: 4px;
    }

    .typingDot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #64b8ff;
      animation: typing 1s infinite ease-in-out;
    }

    .typingDot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typingDot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* =========================================================
       MESSAGE COMPOSER
       ========================================================= */

    .composer {
      min-height: 67px;
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      gap: 7px;

      padding:
        7px 10px
        max(7px, env(safe-area-inset-bottom))
        10px;

      background:
        rgba(6, 8, 18, 0.98);

      border-top: 1px solid rgba(83, 105, 255, 0.14);
    }

    .composerButton {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border-radius: 13px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: transparent;
      color: #78bfff;
    }

    .composerButton svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .composerBox {
      min-width: 0;
      flex: 1;
      min-height: 46px;

      display: flex;
      align-items: center;

      padding: 0 10px;

      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          rgba(18, 22, 45, 0.98),
          rgba(14, 17, 34, 0.98)
        );

      border: 1px solid rgba(83, 111, 255, 0.18);

      box-shadow:
        inset 0 0 20px rgba(52, 78, 190, 0.05);
    }

    #messageInput {
      width: 100%;
      min-width: 0;
      max-height: 100px;
      resize: none;

      border: 0;
      outline: 0;
      background: transparent;

      color: #fff;
      font-size: 14px;
    }

    #messageInput::placeholder {
      color: #7d829b;
    }

    .micButton {
      color: #c761ff;
    }

    .sendButton {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      color: white;

      background:
        linear-gradient(
          135deg,
          #7140ff,
          #d329ff
        );

      box-shadow:
        0 0 12px rgba(161, 45, 255, 0.55),
        0 0 27px rgba(88, 63, 255, 0.2);
    }

    .sendButton svg {
      width: 23px;
      height: 23px;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 1;
    }

    /* =========================================================
       BOTTOM NAVIGATION
       ========================================================= */

    .bottomNav {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      bottom: 0;

      height: 74px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      padding:
        5px 7px
        max(7px, env(safe-area-inset-bottom));

      background:
        linear-gradient(
          180deg,
          rgba(8, 10, 22, 0.94),
          rgba(5, 7, 17, 0.99)
        );

      border-top: 1px solid rgba(86, 107, 255, 0.17);

      box-shadow:
        0 -8px 28px rgba(0, 0, 0, 0.25);
    }

    .navButton {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;

      color: #85899e;
      background: transparent;

      font-size: 11px;
      font-weight: 650;

      transition: 0.2s ease;
    }

    .navButton svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .navButton.active {
      color: #d871ff;

      text-shadow:
        0 0 12px rgba(212, 82, 255, 0.45);
    }

    .navButton.active svg {
      filter:
        drop-shadow(
          0 0 7px rgba(205, 72, 255, 0.75)
        );
    }

    .navButton.active::before {
      content: "";
      position: absolute;
      top: -6px;
      width: 32px;
      height: 3px;
      border-radius: 5px;

      background:
        linear-gradient(
          90deg,
          #3e91ff,
          #d638ff
        );

      box-shadow:
        0 0 12px rgba(166, 49, 255, 0.7);
    }

    /* =========================================================
       FLOATING NEW CHAT BUTTON
       ========================================================= */

    .newChatButton {
      position: absolute;
      z-index: 25;

      right: 17px;
      bottom: 87px;

      width: 57px;
      height: 57px;
      border-radius: 19px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #247fff,
          #9b32ff
        );

      color: white;

      box-shadow:
        0 0 18px rgba(60, 123, 255, 0.42),
        0 0 34px rgba(168, 44, 255, 0.25);
    }

    .newChatButton svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* =========================================================
       CALL OVERLAY
       ========================================================= */

    #callOverlay {
      position: absolute;
      inset: 0;
      z-index: 100;

      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 25px;

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(72, 70, 255, 0.28),
          transparent 40%
        ),
        rgba(3, 5, 14, 0.98);
    }

    #callOverlay.show {
      display: flex;
      animation: callIn 0.25s ease;
    }

    @keyframes callIn {
      from {
        opacity: 0;
        transform: scale(0.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #remoteVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #03040b;
    }

    #localVideo {
      position: absolute;
      z-index: 3;
      right: 14px;
      top: 80px;
      width: 105px;
      height: 145px;
      border-radius: 15px;
      object-fit: cover;

      background: #101329;
      border: 1px solid rgba(126, 117, 255, 0.5);

      box-shadow:
        0 0 20px rgba(0, 132, 255, 0.18);
    }

    .callInfo {
      position: absolute;
      z-index: 4;
      top: 42px;
      left: 0;
      right: 0;
      text-align: center;

      pointer-events: none;
    }

    #callName {
      font-size: 22px;
      font-weight: 850;
      text-shadow: 0 2px 12px #000;
    }

    #callStatus {
      margin-top: 5px;
      color: #8fbaff;
      font-size: 13px;
    }

    .callControls {
      position: absolute;
      z-index: 5;
      left: 20px;
      right: 20px;
      bottom: 35px;

      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .callControl {
      width: 56px;
      height: 56px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      background: rgba(25, 28, 52, 0.9);

      border: 1px solid rgba(118, 132, 255, 0.3);

      backdrop-filter: blur(10px);
    }

    .callControl svg {
      width: 23px;
      height: 23px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .endCall {
      background:
        linear-gradient(
          135deg,
          #ff365c,
          #d51549
        );

      border-color: rgba(255, 120, 140, 0.5);

      box-shadow:
        0 0 18px rgba(255, 45, 90, 0.35);
    }

    /* =========================================================
       LOADING
       ========================================================= */

    #loadingScreen {
      position: absolute;
      inset: 0;
      z-index: 200;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050711;

      transition: opacity 0.35s ease;
    }

    #loadingScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loadingLogo {
      width: 75px;
      height: 75px;
      border-radius: 23px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #149fff,
          #703cff,
          #d62cff
        );

      font-size: 26px;
      font-weight: 900;

      box-shadow:
        0 0 25px rgba(36, 142, 255, 0.4),
        0 0 55px rgba(185, 43, 255, 0.28);

      animation:
        loadingPulse 1.4s infinite ease-in-out;
    }

    @keyframes loadingPulse {
      0%,
      100% {
        transform: scale(0.95);
        filter: brightness(0.9);
      }

      50% {
        transform: scale(1.05);
        filter: brightness(1.2);
      }
    }

    /* =========================================================
       TOAST
       ========================================================= */

    #toast {
      position: absolute;
      z-index: 300;

      left: 50%;
      bottom: 90px;

      transform:
        translate(-50%, 20px);

      opacity: 0;
      pointer-events: none;

      max-width: calc(100% - 35px);

      padding: 11px 15px;
      border-radius: 13px;

      background:
        rgba(19, 23, 46, 0.96);

      border: 1px solid rgba(96, 117, 255, 0.28);

      color: white;
      font-size: 12px;
      text-align: center;

      box-shadow:
        0 0 20px rgba(53, 92, 255, 0.15);

      transition: 0.25s ease;
    }

    #toast.show {
      opacity: 1;
      transform:
        translate(-50%, 0);
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 370px) {
      .brandLogo {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
      }

      .brandName {
        font-size: 21px;
      }

      .headerButton {
        width: 37px;
      }

      .chatItem {
        gap: 9px;
      }

      .avatar {
        width: 52px;
        height: 52px;
        flex-basis: 52px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       LIVE ELECTRICAL NETWORK BACKGROUND
       ========================================================= -->

  <canvas id="networkCanvas"></canvas>

  <div class="networkGlow"></div>

  <!-- =========================================================
       JCHAT APPLICATION
       ========================================================= -->

  <div id="jchatApp">

    <div class="phoneShell">

      <!-- =====================================================
           LOADING
           ===================================================== -->

      <div id="loadingScreen">
        <div class="loadingLogo">
          jC
        </div>
      </div>

      <!-- =====================================================
           HEADER
           ===================================================== -->

      <header class="topHeader">

        <div class="brand">

          <div class="brandLogo">
            <span class="brandLogoText">jC</span>
          </div>

          <div class="brandName">
            jChat
          </div>

        </div>

        <div class="headerActions">

          <button
            class="headerButton"
            id="searchButton"
            aria-label="Search"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-4-4"></path>
            </svg>
          </button>

          <button
            class="headerButton videoHeaderButton"
            id="headerVideoButton"
            aria-label="Video call"
          >
            <svg viewBox="0 0 24 24">
              <rect
                x="3"
                y="6"
                width="13"
                height="12"
                rx="2"
              ></rect>
              <path d="M16 10l5-3v10l-5-3"></path>
            </svg>
          </button>

          <button
            class="headerButton"
            id="menuButton"
            aria-label="Menu"
          >
            <svg viewBox="0 0 24 24">
              <path d="M4 6h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 18h16"></path>
            </svg>
          </button>

        </div>

      </header>

      <!-- =====================================================
           MAIN CONTENT
           ===================================================== -->

      <main class="mainContent">

        <!-- ===================================================
             CHATS
             =================================================== -->

        <section
          class="screen active"
          id="chatsScreen"
          data-screen="chats"
        >

          <div class="sectionHeader">
            <div class="sectionTitle">
              CHATS
            </div>
          </div>

          <div
            class="searchWrap"
            id="searchContainer"
            style="display:none;"
          >
            <div class="searchBox">

              <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-4-4"></path>
              </svg>

              <input
                id="chatSearchInput"
                type="search"
                placeholder="Search chats..."
                autocomplete="off"
              />

            </div>
          </div>

          <div
            class="chatList"
            id="chatList"
          >
            <!-- REAL FIREBASE CHATS ARE INSERTED HERE -->
          </div>

          <div
            class="emptyState"
            id="emptyChats"
            style="display:none;"
          >

            <div class="emptyIcon">

              <svg viewBox="0 0 24 24">
                <path d="M4 5h16v11H8l-4 4z"></path>
              </svg>

            </div>

            <div class="emptyTitle">
              No chats yet
            </div>

            <div class="emptyText">
              Start a conversation with one of your contacts.
            </div>

          </div>

        </section>

        <!-- ===================================================
             UPDATES
             =================================================== -->

        <section
          class="screen"
          id="updatesScreen"
          data-screen="updates"
        >

          <div class="sectionHeader">
            <div class="sectionTitle">
              UPDATES
            </div>
          </div>

          <div class="statusCard">

            <div class="statusRow">

              <div class="statusAvatar">
                <div
                  class="statusAvatarInner"
                  id="myStatusAvatar"
                >
                  +
                </div>
              </div>

              <div>
                <div class="statusName">
                  My status
                </div>

                <div class="statusTime">
                  Add a status update
                </div>
              </div>

            </div>

          </div>

          <div
            id="statusList"
            class="contactList"
          >
            <!-- REAL STATUS UPDATES -->
          </div>

        </section>

        <!-- ===================================================
             CONTACTS
             =================================================== -->

        <section
          class="screen"
          id="contactsScreen"
          data-screen="contacts"
        >

          <div class="sectionHeader">
            <div class="sectionTitle">
              CONTACTS
            </div>
          </div>

          <div class="searchWrap">

            <div class="searchBox">

              <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-4-4"></path>
              </svg>

              <input
                id="contactSearchInput"
                type="search"
                placeholder="Search contacts..."
                autocomplete="off"
              />

            </div>

          </div>

          <div
            class="contactList"
            id="contactList"
          >
            <!-- REAL FIREBASE CONTACTS -->
          </div>

        </section>

        <!-- ===================================================
             CALLS
             =================================================== -->

        <section
          class="screen"
          id="callsScreen"
          data-screen="calls"
        >

          <div class="sectionHeader">
            <div class="sectionTitle">
              CALLS
            </div>
          </div>

          <div id="callHistory">

            <!-- REAL CALL HISTORY -->
            
          </div>

          <div
            class="emptyState"
            id="emptyCalls"
            style="display:none;"
          >

            <div class="emptyIcon">

              <svg viewBox="0 0 24 24">
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2
                  19.79 19.79 0 0 1-8.63-3.07
                  19.5 19.5 0 0 1-6-6
                  A19.79 19.79 0 0 1 2.12 4.18
                  2 2 0 0 1 4.11 2h3
                  a2 2 0 0 1 2 1.72
                  12.84 12.84 0 0 0 .7 2.81
                  2 2 0 0 1-.45 2.11L8.09 9.91
                  a16 16 0 0 0 6 6l1.27-1.27
                  a2 2 0 0 1 2.11-.45
                  12.84 12.84 0 0 0 2.81.7
                  A2 2 0 0 1 22 16.92z"
                ></path>
              </svg>

            </div>

            <div class="emptyTitle">
              No calls yet
            </div>

            <div class="emptyText">
              Your voice and video calls will appear here.
            </div>

          </div>

        </section>

        <!-- ===================================================
             PROFILE
             =================================================== -->

        <section
          class="screen"
          id="profileScreen"
          data-screen="profile"
        >

          <div class="profileHeader">

            <div class="profileAvatar">

              <div
                class="profileAvatarInner"
                id="profileAvatar"
              >
                jC
              </div>

            </div>

            <div
              class="profileName"
              id="profileName"
            >
              jChat User
            </div>

            <div
              class="profileAbout"
              id="profileAbout"
            >
              Hey there! I am using jChat.
            </div>

          </div>

          <div class="settingsList">

            <button
              class="settingItem"
              id="editProfileButton"
            >

              <div class="settingIcon">

                <svg viewBox="0 0 24 24">
                  <path d="M12 20h9"></path>
                  <path
                    d="M16.5 3.5
                    a2.12 2.12 0 0 1 3 3L7 19l-4 1
                    1-4z"
                  ></path>
                </svg>

              </div>

              <div class="settingText">

                <div class="settingTitle">
                  Edit profile
                </div>

                <div class="settingSub">
                  Name, photo and about
                </div>

              </div>

            </button>

            <button
              class="settingItem"
              id="privacyButton"
            >

              <div class="settingIcon">

                <svg viewBox="0 0 24 24">
                  <rect
                    x="3"
                    y="11"
                    width="18"
                    height="10"
                    rx="2"
                  ></rect>
                  <path
                    d="M7 11V7a5 5 0 0 1 10 0v4"
                  ></path>
                </svg>

              </div>

              <div class="settingText">

                <div class="settingTitle">
                  Privacy
                </div>

                <div class="settingSub">
                  Control your privacy
                </div>

              </div>

            </button>

            <button
              class="settingItem"
              id="notificationsButton"
            >

              <div class="settingIcon">

                <svg viewBox="0 0 24 24">
                  <path
                    d="M18 8a6 6 0 0 0-12 0
                    c0 7-3 7-3 9h18c0-2-3-2-3-9"
                  ></path>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>

              </div>

              <div class="settingText">

                <div class="settingTitle">
                  Notifications
                </div>

                <div class="settingSub">
                  Messages and calls
                </div>

              </div>

            </button>

            <button
              class="settingItem"
              id="settingsButton"
            >

              <div class="settingIcon">

                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path
                    d="M19.4 15a1.65 1.65 0 0 0
                    .33 1.82l.06.06a2 2 0 1 1-2.83
                    2.83l-.06-.06a1.65 1.65 0 0 0
                    -1.82-.33 1.65 1.65 0 0 0
                    -1 1.51V21a2 2 0 1 1-4 0v-.09
                    A1.65 1.65 0 0 0 9 19.4
                    a1.65 1.65 0 0 0-1.82.33l-.06.06
                    a2 2 0 1 1-2.83-2.83l.06-.06
                    A1.65 1.65 0 0 0 4.6 15
                    1.65 1.65 0 0 0 3.09 14H3a2 2 0 1 1
                    0-4h.09A1.65 1.65 0 0 0 4.6 9
                    a1.65 1.65 0 0 0-.33-1.82l-.06-.06
                    a2 2 0 1 1 2.83-2.83l.06.06
                    A1.65 1.65 0 0 0 9 4.6
                    1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1
                    4 0v.09A1.65 1.65 0 0 0 15 4.6
                    a1.65 1.65 0 0 0 1.82-.33l.06-.06
                    a2 2 0 1 1 2.83 2.83l-.06.06
                    A1.65 1.65 0 0 0 19.4 9
                    1.65 1.65 0 0 0 20.91 10H21a2 2 0 1 1
                    0 4h-.09A1.65 1.65 0 0 0 19.4 15z"
                  ></path>
                </svg>

              </div>

              <div class="settingText">

                <div class="settingTitle">
                  Settings
                </div>

                <div class="settingSub">
                  App preferences
                </div>

              </div>

            </button>

            <button
              class="settingItem"
              id="logoutButton"
            >

              <div class="settingIcon">

                <svg viewBox="0 0 24 24">
                  <path d="M10 17l5-5-5-5"></path>
                  <path d="M15 12H3"></path>
                  <path
                    d="M21 19V5a2 2 0 0 0-2-2h-6"
                  ></path>
                </svg>

              </div>

              <div class="settingText">

                <div class="settingTitle">
                  Log out
                </div>

                <div class="settingSub">
                  Sign out of this device
                </div>

              </div>

            </button>

          </div>

        </section>

      </main>

      <!-- =====================================================
           NEW CHAT BUTTON
           ===================================================== -->

      <button
        class="newChatButton"
        id="newChatButton"
        aria-label="New chat"
      >

        <svg viewBox="0 0 24 24">
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>

      </button>

      <!-- =====================================================
           BOTTOM NAVIGATION
           ===================================================== -->

      <nav class="bottomNav">

        <button
          class="navButton active"
          data-target="chatsScreen"
        >

          <svg viewBox="0 0 24 24">
            <path d="M4 5h16v11H8l-4 4z"></path>
          </svg>

          <span>Chats</span>

        </button>

        <button
          class="navButton"
          data-target="updatesScreen"
        >

          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8"></circle>
            <circle cx="12" cy="12" r="4"></circle>
          </svg>

          <span>Updates</span>

        </button>

        <button
          class="navButton"
          data-target="callsScreen"
        >

          <svg viewBox="0 0 24 24">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2
              19.79 19.79 0 0 1-8.63-3.07
              19.5 19.5 0 0 1-6-6
              A19.79 19.79 0 0 1 2.12 4.18
              2 2 0 0 1 4.11 2h3

  <!-- =========================================================
       LIVE ELECTRICAL NETWORK ENGINE
       ========================================================= -->

  <script>
    (() => {
      const canvas = document.getElementById("networkCanvas");
      const ctx = canvas.getContext("2d", {
        alpha: true
      });

      let width = 0;
      let height = 0;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      let nodes = [];
      let pulses = [];

      let pointer = {
        x: null,
        y: null,
        active: false
      };

      const CONFIG = {
        density: 0.000065,
        minNodes: 28,
        maxNodes: 75,
        connectionDistance: 135,
        nodeSpeed: 0.18,
        pulseChance: 0.018
      };

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;

        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(
          dpr,
          0,
          0,
          dpr,
          0,
          0
        );

        createNetwork();
      }

      function random(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createNetwork() {
        const targetCount = Math.max(
          CONFIG.minNodes,
          Math.min(
            CONFIG.maxNodes,
            Math.floor(width * height * CONFIG.density)
          )
        );

        nodes = [];

        for (let i = 0; i < targetCount; i++) {
          nodes.push({
            x: random(0, width),
            y: random(0, height),

            vx: random(
              -CONFIG.nodeSpeed,
              CONFIG.nodeSpeed
            ),

            vy: random(
              -CONFIG.nodeSpeed,
              CONFIG.nodeSpeed
            ),

            radius: random(1.1, 2.6),

            hue:
              Math.random() < 0.52
                ? "blue"
                : "purple",

            phase: random(0, Math.PI * 2)
          });
        }

        pulses = [];
      }

      function drawNode(node, time) {
        const pulse =
          1 +
          Math.sin(
            time * 0.002 + node.phase
          ) *
            0.3;

        const r = node.radius * pulse;

        const glow =
          node.hue === "blue"
            ? "rgba(28,164,255,0.8)"
            : "rgba(202,64,255,0.8)";

        const core =
          node.hue === "blue"
            ? "rgba(120,220,255,1)"
            : "rgba(244,150,255,1)";

        ctx.beginPath();

        ctx.shadowBlur = 16;
        ctx.shadowColor = glow;

        ctx.fillStyle = core;

        ctx.arc(
          node.x,
          node.y,
          r,
          0,
          Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
      }

      function drawConnections() {
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i];
            const b = nodes[j];

            const dx = a.x - b.x;
            const dy = a.y - b.y;

            const distance =
              Math.sqrt(
                dx * dx + dy * dy
              );

            if (
              distance >
              CONFIG.connectionDistance
            ) {
              continue;
            }

            let alpha =
              1 -
              distance /
                CONFIG.connectionDistance;

            alpha *= 0.26;

            const isBlue =
              a.hue === "blue" ||
              b.hue === "blue";

            const rgb = isBlue
              ? "40,145,255"
              : "190,55,255";

            ctx.beginPath();

            ctx.strokeStyle =
              `rgba(${rgb},${alpha})`;

            ctx.lineWidth = 0.65;

            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);

            ctx.stroke();

            if (
              Math.random() <
              CONFIG.pulseChance *
                0.015
            ) {
              pulses.push({
                a,
                b,
                progress: 0,

                color:
                  isBlue
                    ? "rgba(95,220,255,1)"
                    : "rgba(232,104,255,1)"
              });
            }
          }
        }
      }

      function drawPulses() {
        for (
          let i = pulses.length - 1;
          i >= 0;
          i--
        ) {
          const pulse = pulses[i];

          pulse.progress += 0.012;

          if (pulse.progress >= 1) {
            pulses.splice(i, 1);
            continue;
          }

          const x =
            pulse.a.x +
            (pulse.b.x - pulse.a.x) *
              pulse.progress;

          const y =
            pulse.a.y +
            (pulse.b.y - pulse.a.y) *
              pulse.progress;

          ctx.beginPath();

          ctx.shadowBlur = 15;
          ctx.shadowColor =
            pulse.color;

          ctx.fillStyle =
            pulse.color;

          ctx.arc(
            x,
            y,
            1.5,
            0,
            Math.PI * 2
          );

          ctx.fill();

          ctx.shadowBlur = 0;
        }
      }

      function updateNodes() {
        for (const node of nodes) {
          node.x += node.vx;
          node.y += node.vy;

          if (
            node.x < -20 ||
            node.x > width + 20
          ) {
            node.vx *= -1;
          }

          if (
            node.y < -20 ||
            node.y > height + 20
          ) {
            node.vy *= -1;
          }

          if (pointer.active) {
            const dx =
              pointer.x - node.x;

            const dy =
              pointer.y - node.y;

            const distance =
              Math.sqrt(
                dx * dx + dy * dy
              );

            if (
              distance < 130 &&
              distance > 1
            ) {
              const force =
                (130 - distance) /
                130 *
                0.012;

              node.vx -=
                dx / distance *
                force;

              node.vy -=
                dy / distance *
                force;
            }
          }

          node.vx *= 0.998;
          node.vy *= 0.998;

          const speed =
            Math.sqrt(
              node.vx * node.vx +
              node.vy * node.vy
            );

          if (speed < 0.03) {
            node.vx += random(
              -0.01,
              0.01
            );

            node.vy += random(
              -0.01,
              0.01
            );
          }
        }
      }

      function drawPointerNetwork() {
        if (!pointer.active) {
          return;
        }

        for (const node of nodes) {
          const dx =
            pointer.x - node.x;

          const dy =
            pointer.y - node.y;

          const distance =
            Math.sqrt(
              dx * dx + dy * dy
            );

          if (distance < 150) {
            const alpha =
              (1 - distance / 150) *
              0.22;

            ctx.beginPath();

            ctx.strokeStyle =
              `rgba(104,180,255,${alpha})`;

            ctx.lineWidth = 0.7;

            ctx.moveTo(
              pointer.x,
              pointer.y
            );

            ctx.lineTo(
              node.x,
              node.y
            );

            ctx.stroke();
          }
        }

        ctx.beginPath();

        ctx.shadowBlur = 20;
        ctx.shadowColor =
          "rgba(180,70,255,0.8)";

        ctx.fillStyle =
          "rgba(180,110,255,0.85)";

        ctx.arc(
          pointer.x,
          pointer.y,
          2,
          0,
          Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
      }

      function animate(time) {
        ctx.clearRect(
          0,
          0,
          width,
          height
        );

        updateNodes();

        drawConnections();

        drawPointerNetwork();

        for (const node of nodes) {
          drawNode(node, time);
        }

        drawPulses();

        requestAnimationFrame(animate);
      }

      window.addEventListener(
        "resize",
        resize,
        {
          passive: true
        }
      );

      window.addEventListener(
        "pointermove",
        (event) => {
          pointer.x =
            event.clientX;

          pointer.y =
            event.clientY;

          pointer.active = true;
        },
        {
          passive: true
        }
      );

      window.addEventListener(
        "pointerleave",
        () => {
          pointer.active = false;
        },
        {
          passive: true
        }
      );

      window.addEventListener(
        "touchstart",
        (event) => {
          const touch =
            event.touches[0];

          if (!touch) return;

          pointer.x =
            touch.clientX;

          pointer.y =
            touch.clientY;

          pointer.active = true;
        },
        {
          passive: true
        }
      );

      window.addEventListener(
        "touchmove",
        (event) => {
          const touch =
            event.touches[0];

          if (!touch) return;

          pointer.x =
            touch.clientX;

          pointer.y =
            touch.clientY;

          pointer.active = true;
        },
        {
          passive: true
        }
      );

      window.addEventListener(
        "touchend",
        () => {
          pointer.active = false;
        },
        {
          passive: true
        }
      );

      resize();
      requestAnimationFrame(animate);
    })();
  </script>

  <!-- =========================================================
       BASIC JCHAT SCREEN CONTROLLER
       app.js remains responsible for Firebase/live functionality.
       ========================================================= -->

  <script>
    (() => {

      const screens =
        document.querySelectorAll(
          ".screen"
        );

      const navButtons =
        document.querySelectorAll(
          ".navButton"
        );

      const chatWindow =
        document.getElementById(
          "chatWindow"
        );

      const closeChatButton =
        document.getElementById(
          "closeChatButton"
        );

      const searchButton =
        document.getElementById(
          "searchButton"
        );

      const searchContainer =
        document.getElementById(
          "searchContainer"
        );

      const searchInput =
        document.getElementById(
          "chatSearchInput"
        );

      const newChatButton =
        document.getElementById(
          "newChatButton"
        );

      const messageInput =
        document.getElementById(
          "messageInput"
        );

      const sendButton =
        document.getElementById(
          "sendMessageButton"
        );

      const toast =
        document.getElementById(
          "toast"
        );

      function showScreen(id) {
        screens.forEach(
          (screen) => {
            screen.classList.toggle(
              "active",
              screen.id === id
            );
          }
        );

        navButtons.forEach(
          (button) => {
            button.classList.toggle(
              "active",
              button.dataset.target === id
            );
          }
        );
      }

      navButtons.forEach(
        (button) => {
          button.addEventListener(
            "click",
            () => {
              showScreen(
                button.dataset.target
              );
            }
          );
        }
      );

      searchButton.addEventListener(
        "click",
        () => {
          const visible =
            searchContainer.style.display !==
            "none";

          searchContainer.style.display =
            visible
              ? "none"
              : "block";

          if (!visible) {
            searchInput.focus();
          }
        }
      );

      closeChatButton.addEventListener(
        "click",
        () => {
          chatWindow.classList.remove(
            "open"
          );
        }
      );

      newChatButton.addEventListener(
        "click",
        () => {
          showToast(
            "Choose a contact to start a new chat."
          );

          showScreen(
            "contactsScreen"
          );
        }
      );

      messageInput.addEventListener(
        "input",
        () => {
          messageInput.style.height =
            "auto";

          messageInput.style.height =
            Math.min(
              messageInput.scrollHeight,
              100
            ) + "px";
        }
      );

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(
          window.jChatToastTimer
        );

        window.jChatToastTimer =
          setTimeout(() => {
            toast.classList.remove(
              "show"
            );
          }, 2300);
      }

      window.jChatUI = {
        showScreen,
        showToast,

        openChat(data = {}) {
          const name =
            document.getElementById(
              "chatHeaderName"
            );

          const status =
            document.getElementById(
              "chatHeaderStatus"
            );

          const avatar =
            document.getElementById(
              "chatHeaderAvatar"
            );

          name.textContent =
            data.name ||
            "Contact";

          status.textContent =
            data.status ||
            "Offline";

          avatar.textContent =
            data.initials ||
            "JC";

          if (data.photoURL) {
            avatar.innerHTML =
              `<img src="${data.photoURL}" alt="">`;
          }

          chatWindow.classList.add(
            "open"
          );
        }
      };

      /*
       * These events are deliberately exposed for app.js.
       * app.js can listen for them or use window.jChatUI.
       */

      sendButton.addEventListener(
        "click",
        () => {
          const event =
            new CustomEvent(
              "jchat-send-message",
              {
                detail: {
                  text:
                    messageInput.value.trim()
                }
              }
            );

          document.dispatchEvent(
            event
          );
        }
      );

      messageInput.addEventListener(
        "keydown",
        (event) => {
          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {
            event.preventDefault();

            sendButton.click();
          }
        }
      );

      document.addEventListener(
        "jchat-message-sent",
        () => {
          messageInput.value = "";
          messageInput.style.height =
            "auto";
        }
      );

      window.addEventListener(
        "load",
        () => {
          setTimeout(() => {
            document
              .getElementById(
                "loadingScreen"
              )
              .classList.add(
                "hidden"
              );
          }, 500);
        }
      );

    })();
  </script>
