<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07110d">
  <title>JDA Networks</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #050908;
      color: #fff;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: #050908;
    }

    .container {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      padding: 24px 18px 35px;
    }

    .logo {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 25px auto 18px;
      background: #10251b;
      border: 2px solid #19c463;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #9ca8a1;
      margin: 8px 0 28px;
      line-height: 1.5;
    }

    .card {
      background: #0c1511;
      border: 1px solid #1b2b23;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #b8c4bd;
      margin: 14px 0 7px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #27382f;
      background: #09100d;
      color: white;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #19c463;
    }

    button {
      border: 0;
      cursor: pointer;
      width: 100%;
      border-radius: 13px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 14px;
    }

    .primary {
      background: #18c463;
      color: #031008;
    }

    .secondary {
      background: #17231d;
      color: white;
      border: 1px solid #27382f;
    }

    .danger {
      background: #401719;
      color: #ffb5b5;
      border: 1px solid #69272a;
    }

    .choice-row {
      display: flex;
      gap: 10px;
    }

    .choice {
      flex: 1;
      background: #101b16;
      color: #b8c4bd;
      border: 1px solid #26382e;
      margin-top: 0;
    }

    .choice.active {
      background: #18c463;
      color: #041009;
      border-color: #18c463;
    }

    .hidden {
      display: none !important;
    }

    .message {
      border-radius: 12px;
      padding: 12px;
      margin: 12px 0;
      font-size: 14px;
      line-height: 1.45;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #351416;
      color: #ffb9b9;
      border: 1px solid #67272a;
    }

    .message.success {
      background: #0d2d1d;
      color: #9bf0bd;
      border: 1px solid #1a6840;
    }

    .message.info {
      background: #10222d;
      color: #a9d8f0;
      border: 1px solid #24516a;
    }

    .photo-area {
      text-align: center;
      margin: 12px 0 18px;
    }

    .photo-preview {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      background: #101a15;
      border: 2px dashed #345040;
      display: block;
      margin: 0 auto 12px;
    }

    .photo-button {
      display: inline-block;
      background: #17231d;
      color: white;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #2a3d32;
    }

    .small {
      font-size: 12px;
      color: #87958d;
      line-height: 1.5;
      margin-top: 8px;
    }

    .status-box {
      text-align: center;
      padding: 30px 15px;
    }

    .status-icon {
      font-size: 52px;
      margin-bottom: 12px;
    }

    .status-box h2 {
      margin: 8px 0;
    }

    .status-box p {
      color: #aab6af;
      line-height: 1.6;
    }

    .profile-summary {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .profile-summary img {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #19c463;
    }

    .profile-summary strong {
      font-size: 17px;
    }

    .profile-summary span {
      display: block;
      color: #93a098;
      font-size: 13px;
      margin-top: 4px;
    }

    .top-title {
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      margin: 8px 0 22px;
    }

    .footer {
      text-align: center;
      color: #66736c;
      font-size: 11px;
      margin-top: 25px;
    }

    .loading
