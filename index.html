<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JDA Networks - Realistic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;background:#4A7CFF;width:100vw;height:100vh;overflow:hidden}
#stage{width:100%;height:100%;background:#4A7CFF;position:relative;overflow:hidden}

/* MAN CONTAINER */
#manWrap{position:absolute;bottom:20px;left:-300px;width:280px;height:480px;z-index:10;will-change:left,transform}
#manWrap img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 15px 20px rgba(0,0,0,0.3))}
#manWrap.walking{animation:walkBob 0.35s infinite alternate}
@keyframes walkBob{0%{transform:translateY(0)}100%{transform:translateY(-6px)}}

/* BAG ON FLOOR */
#floorBag{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);width:110px;height:75px;background:#6B4226;border-radius:8px;display:none;z-index:5;align-items:center;justify-content:center;color:#D4A574;font-weight:900;box-shadow:0 10px 20px rgba(0,0,0,0.3)}

/* FORM - transforms from bag */
#formBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:white;width:340px;border-radius:20px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,0.5);z-index:20;opacity:0}
#formBox.show{animation:pop 0.8s cubic-bezier(0.175,0.885,0.32,1.275) forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}60%{transform:translate(-50%,-50%) scale(1.1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#formBox input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-top:10px;font-size:14px;outline:none}
#formBox input:focus{border-color:#4A7CFF;box-shadow:0 0 0 3px rgba(74,124,255,0.2)}
#formBox button{width:100%;background:#10b981;color:white;border:none;padding:12px;border-radius:10px;margin-top:14px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="stage">
  <div id="manWrap"><img id="manImg" src="./man-walk.png" alt="man"></div>
  <div id="floorBag">JDA</div>

  <div id="formBox">
    <h2 style="text-align:center;font-size:18px">Register now</h2>
    <p style="text-align:center;font-size:11px;color:#6b7280;margin:6px 0">Real Name • JDA Number • Photo MUST</p>
    <input id="realName" placeholder="Real Name (No nickname)">
    <input id="jdaNumber" placeholder="JDA Number JD-2025-XXXX" style="font-family:monospace">
    <input type="file" id="photoInput" accept="image/*">
    <div id="preview" style="text-align:center;margin-top:8px"></div>
    <button id="registerBtn">Register & Go Live</button>
  </div>
</div>

<script type="module">
import { collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { db } from "./firebase.js";

const manWrap = document.getElementById('manWrap');
const manImg = document.getElementById('manImg');
const floorBag = document.getElementById('floorBag');
const formBox = document.getElementById('formBox');

// EXACT VIDEO TIMELINE
let x = -300;
const targetX = window.innerWidth/2 - 140;

// Phase 0: Walk from left to center with bag (like video 0.0s)
const walkIn = setInterval(()=>{
  x += 5;
  manWrap.style.left = x + 'px';
  if(x >= targetX){
    clearInterval(walkIn);
    // Phase 1: Kneel (like video 1.1s)
    manWrap.classList.remove('walking');
    manImg.src = './man-kneel.png';
    manWrap.style.transform = 'scale(1.1)';
    manWrap.style.bottom = '10px';

    setTimeout(()=>{
      // Phase 2: Place bag down (like video 2.1s)
      floorBag.style.display = 'flex';
      floorBag.style.left = (targetX + 90) + 'px';

      setTimeout(()=>{
        // Phase 3: Stand up (like video 3.2s)
        manImg.src = './man-walk.png';
        manWrap.style.transform = 'scale(1)';
        manWrap.style.bottom = '20px';

        setTimeout(()=>{
          // Phase 4: Bag becomes form (like video 5.3s)
          floorBag.style.transition = 'all 0.6s cubic-bezier(0.175,0.885,0.32,1.275)';
          floorBag.style.transform = 'translateX(-50%) scale(3.5)';
          floorBag.style.opacity = '0';

          setTimeout(()=>{
            formBox.classList.add('show');
            floorBag.style.display='none';

            // Phase 5: Man walks out right (like video after form appears)
            let x2 = targetX;
            const walkOut = setInterval(()=>{
              x2 += 6;
              manWrap.style.left = x2 + 'px';
              manWrap.classList.add('walking');
              if(x2 > window.innerWidth + 100) clearInterval(walkOut);
            },16);
          },400);
        },600);
      },500);
    },900);
  }
},16);
manWrap.classList.add('walking');

// JDA Logic
let photoBase64="";
document.getElementById('photoInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=ev=>{photoBase64=ev.target.result; document.getElementById('preview').innerHTML=`<img src="${photoBase64}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid #10b981">`;}; r.readAsDataURL(f);
});
document.getElementById('registerBtn').addEventListener('click',async()=>{
  const rn=document.getElementById('realName').value.trim();
  const jd=document.getElementById('jdaNumber').value.trim().toUpperCase();
  if(!rn||!jd||!photoBase64){alert("Real Name + JDA Number + Photo MUST Boss!");return;}
  if(!jd.startsWith("JD-")){alert("JDA Number must start with JD-");return;}
  const btn=document.getElementById('registerBtn'); btn.innerText="Sending..."; btn.disabled=true;
  const q=query(collection(db,"jda_users_v2"),where("jdaNumber","==",jd)); const s=await getDocs(q);
  if(!s.empty){alert("JDA Number once only!"); btn.innerText="Register & Go Live"; btn.disabled=false; return;}
  await addDoc(collection(db,"jda_users_v2"),{realName:rn,jdaNumber:jd,profilePhoto:photoBase64,status:"pending",createdAt:new Date()});
  alert("✓ Sent to Admin!"); location.reload();
});
</script>
</body>
</html>
