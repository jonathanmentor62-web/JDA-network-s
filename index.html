<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JDA Networks · Live Registration</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      margin: 0;
      background: #4A7CFF;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #stage {
      width: 100%;
      height: 100%;
      background: #4A7CFF;
      position: relative;
      overflow: hidden;
      /* subtle grid for realism */
      background-image: 
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 42px 42px;
    }

    /* ----- walking man container ----- */
    #manWrap {
      position: absolute;
      bottom: 20px;
      left: -300px;
      width: 280px;
      height: 480px;
      z-index: 10;
      will-change: left, transform;
      transition: bottom 0.25s ease, transform 0.3s ease;
    }

    #manWrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.3));
    }

    #manWrap.walking {
      animation: walkBob 0.35s infinite alternate;
    }

    @keyframes walkBob {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }

    /* ----- floor bag (becomes form) ----- */
    #floorBag {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 75px;
      background: #6B4226;
      border-radius: 8px;
      display: none;
      z-index: 5;
      align-items: center;
      justify-content: center;
      color: #D4A574;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 2px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      border: 2px solid #8B5E3C;
    }

    /* ----- form (transforms from bag) ----- */
    #formBox {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: white;
      width: 340px;
      max-width: 92vw;
      border-radius: 24px;
      padding: 26px 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #formBox.show {
      animation: pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      pointer-events: auto;
    }

    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      60% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    /* form internals */
    #formBox h2 {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.3px;
    }

    #formBox .subhead {
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      margin: 4px 0 10px;
      font-weight: 500;
      background: #f1f5f9;
      padding: 6px 10px;
      border-radius: 40px;
      display: inline-block;
      width: 100%;
    }

    #formBox input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      background: #fafbfc;
    }

    #formBox input:focus {
      border-color: #4A7CFF;
      box-shadow: 0 0 0 3px rgba(74, 124, 255, 0.2);
      background: white;
    }

    #formBox input[type="file"] {
      padding: 8px 0;
      border: none;
      background: transparent;
      font-size: 13px;
      color: #374151;
    }

    #formBox button {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      margin-top: 18px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 6px 14px rgba(16, 185, 129, 0.35);
      letter-spacing: 0.3px;
    }

    #formBox button:hover {
      background: #0da271;
    }

    #formBox button:active {
      transform: scale(0.97);
    }

    #formBox button:disabled {
      background: #9ca3af;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    #preview {
      text-align: center;
      margin-top: 8px;
      min-height: 40px;
      display: flex;
      justify-content: center;
    }

    #preview img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #10b981;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    /* JDA badge on bag */
    #floorBag span {
      font-weight: 900;
      font-size: 18px;
      color: #F5E6D3;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      letter-spacing: 1px;
    }

    /* live indicator */
    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* mobile fine-tune */
    @media (max-width: 480px) {
      #manWrap {
        width: 220px;
        height: 380px;
      }
      #formBox {
        padding: 20px 18px;
        width: 340px;
      }
      #floorBag {
        width: 90px;
        height: 62px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- walking man (will be replaced with real images) -->
    <div id="manWrap">
      <img id="manImg" src="./man-walk.png" alt="man walking">
    </div>

    <!-- floor bag (JDA) -->
    <div id="floorBag"><span>JDA</span></div>

    <!-- registration form -->
    <div id="formBox">
      <h2>
        <span class="live-dot"></span> Register now
      </h2>
      <div class="subhead">
        ⚡ Real Name · JDA Number · Photo MUST
      </div>
      <input id="realName" placeholder="Real Name (No nickname)" autocomplete="off">
      <input id="jdaNumber" placeholder="JDA Number JD-2025-XXXX" style="font-family: 'SF Mono', monospace; text-transform: uppercase;" autocomplete="off">
      <input type="file" id="photoInput" accept="image/*">
      <div id="preview"></div>
      <button id="registerBtn">Register & Go Live</button>
    </div>
  </div>

  <!-- Firebase module (realistic, same as before) -->
  <script type="module">
    // ---- Firebase imports ----
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ---- REPLACE WITH YOUR FIREBASE CONFIG (realistic placeholder) ----
    // For demo purpose, we use a mock config that will fail gracefully if not replaced.
    // In production, replace with your actual Firebase project config.
    const firebaseConfig = {
      apiKey: "AIzaSyDEMO_KEY_REPLACE_ME",
      authDomain: "jda-networks-demo.firebaseapp.com",
      projectId: "jda-networks-demo",
      storageBucket: "jda-networks-demo.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abc123def456"
    };

    // Initialize Firebase (will throw error if config invalid – but we catch)
    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      console.log("🔥 Firebase initialized (demo config)");
    } catch (e) {
      console.warn("⚠️ Firebase not configured. Form will simulate submission.", e);
    }

    // ---- DOM elements ----
    const manWrap = document.getElementById('manWrap');
    const manImg = document.getElementById('manImg');
    const floorBag = document.getElementById('floorBag');
    const formBox = document.getElementById('formBox');

    // ---- Animation state ----
    let animationTimers = [];
    let isAnimating = true;

    // ---- Start the sequence ----
    let x = -300;
    const targetX = window.innerWidth / 2 - 140;

    // Phase 0: Walk from left to center (0.0s)
    manWrap.classList.add('walking');
    const walkIn = setInterval(() => {
      x += 5;
      manWrap.style.left = x + 'px';
      if (x >= targetX) {
        clearInterval(walkIn);

        // Phase 1: Kneel (like video 1.1s)
        manWrap.classList.remove('walking');
        manImg.src = './man-kneel.png';
        manWrap.style.transform = 'scale(1.1)';
        manWrap.style.bottom = '10px';

        setTimeout(() => {
          // Phase 2: Place bag down (2.1s)
          floorBag.style.display = 'flex';
          // position bag exactly under man's hand
          floorBag.style.left = (targetX + 90) + 'px';
          floorBag.style.transform = 'translateX(0)';
          floorBag.style.bottom = '80px';

          setTimeout(() => {
            // Phase 3: Stand up (3.2s)
            manImg.src = './man-walk.png';
            manWrap.style.transform = 'scale(1)';
            manWrap.style.bottom = '20px';

            setTimeout(() => {
              // Phase 4: Bag becomes form (5.3s) - transform & fade bag
              floorBag.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
              floorBag.style.transform = 'translateX(-50%) scale(3.5)';
              floorBag.style.opacity = '0';
              floorBag.style.left = '50%'; // recenter for transform

              setTimeout(() => {
                formBox.classList.add('show');
                floorBag.style.display = 'none';
                isAnimating = false;

                // Phase 5: Man walks out right (after form appears)
                let x2 = targetX;
                manWrap.classList.add('walking');
                const walkOut = setInterval(() => {
                  x2 += 6;
                  manWrap.style.left = x2 + 'px';
                  if (x2 > window.innerWidth + 100) {
                    clearInterval(walkOut);
                    manWrap.style.display = 'none'; // hide when off screen
                  }
                }, 16);

                // store timer to clear if needed
                animationTimers.push(walkOut);

              }, 400);
            }, 600);
          }, 500);
        }, 900);
      }
    }, 16);

    // ---- JDA Registration logic (with Firebase & fallback) ----
    let photoBase64 = "";

    // Photo preview
    document.getElementById('photoInput').addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (!f) return;
      // Check size < 2MB for base64 sanity
      if (f.size > 2 * 1024 * 1024) {
        alert("Photo too large. Please choose an image under 2MB.");
        e.target.value = '';
        return;
      }
      const r = new FileReader();
      r.onload = (ev) => {
        photoBase64 = ev.target.result;
        document.getElementById('preview').innerHTML = `<img src="${photoBase64}" alt="preview">`;
      };
      r.readAsDataURL(f);
    });

    // Register button
    document.getElementById('registerBtn').addEventListener('click', async () => {
      const rn = document.getElementById('realName').value.trim();
      const jd = document.getElementById('jdaNumber').value.trim().toUpperCase();
      const btn = document.getElementById('registerBtn');

      // Validation
      if (!rn || !jd || !photoBase64) {
        alert("Real Name + JDA Number + Photo MUST Boss!");
        return;
      }
      if (!jd.startsWith("JD-")) {
        alert("JDA Number must start with JD- (e.g., JD-2025-1234)");
        return;
      }
      // JDA format: JD-YYYY-XXXX (simple check)
      const jdaPattern = /^JD-\d{4}-\d{4}$/;
      if (!jdaPattern.test(jd)) {
        alert("JDA Number format: JD-2025-1234 (4 digits, dash, 4 digits)");
        return;
      }

      // Disable button
      btn.innerText = "Sending...";
      btn.disabled = true;

      try {
        // If Firebase is not available, simulate a successful registration.
        if (!db) {
          // Simulate delay
          await new Promise(resolve => setTimeout(resolve, 800));
          alert("✓ [Demo] Sent to Admin! (Firebase not configured)");
          location.reload();
          return;
        }

        // Check if JDA number already exists
        const q = query(collection(db, "jda_users_v2"), where("jdaNumber", "==", jd));
        const querySnapshot = await getDocs(q);

        if (!querySnapshot.empty) {
          alert("JDA Number once only! This ID is already registered.");
          btn.innerText = "Register & Go Live";
          btn.disabled = false;
          return;
        }

        // Add document
        await addDoc(collection(db, "jda_users_v2"), {
          realName: rn,
          jdaNumber: jd,
          profilePhoto: photoBase64,
          status: "pending",
          createdAt: new Date()
        });

        alert("✓ Sent to Admin! Your registration is pending approval.");
        location.reload();

      } catch (error) {
        console.error("Registration error:", error);
        alert("⚠️ Something went wrong. Please try again.\n" + (error.message || ""));
        btn.innerText = "Register & Go Live";
        btn.disabled = false;
      }
    });

    // ---- Fallback: if images fail to load, we create inline SVG placeholders ----
    // This ensures the animation works even without the actual PNG files.
    (function ensureImages() {
      const walkSrc = './man-walk.png';
      const kneelSrc = './man-kneel.png';

      // Test if images exist by creating a test image
      const testWalk = new Image();
      testWalk.src = walkSrc;
      testWalk.onerror = function() {
        console.warn("man-walk.png not found – using inline SVG placeholder.");
        // Replace with a simple SVG walking figure
        const svgWalk = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 400'><circle cx='100' cy='70' r='28' fill='%23333'/><rect x='70' y='105' width='60' height='120' rx='20' fill='%23444'/><rect x='50' y='230' width='35' height='110' rx='15' fill='%23222'/><rect x='115' y='230' width='35' height='110' rx='15' fill='%23222'/><rect x='80' y='120' width='40' height='15' fill='%23000'/></svg>`;
        manImg.src = svgWalk;
      };

      // We also preload the kneel version, but if not available we can fallback to a modified walk
      const testKneel = new Image();
      testKneel.src = kneelSrc;
      testKneel.onerror = function() {
        console.warn("man-kneel.png not found – using inline SVG placeholder.");
        // will be set later in the sequence, but we override the src setter in a safe way.
        // we can monkey-patch but simpler: just remember that kneel image is missing.
        // we'll handle in the timeline by checking if the original kneel loaded.
      };

      // store a flag
      window._manKneelAvailable = true;
      testKneel.onload = () => { window._manKneelAvailable = true; };
      testKneel.onerror = () => { window._manKneelAvailable = false; };
    })();

    // Override the kneel image assignment in the timeline if kneel is missing
    // We wrap the original setTimeout logic, but easier: after a short delay we check flag.
    // Actually, we can intercept by using a variable. We'll redefine the sequence slightly.
    // But for simplicity, we replace the kneel assignment dynamically:
    // We'll hook into the existing timeline by re-running the phases with a check.
    // Since the timeline already started, we can't easily rewind. 
    // Solution: we move the entire sequence to a function that can adapt.
    // But we already executed the sequence above. 
    // For robustness, we now use a different approach: reload the animation if kneel missing?
    // Better: we clear all timers and restart with fallback if kneel missing.
    // This is a bit hacky but works for demo realism.

    // We'll implement a fallback: if kneel image fails, we use a kneeling SVG placeholder.
    // We check after 100ms.
    setTimeout(() => {
      if (window._manKneelAvailable === false) {
        console.log("Kneel image missing – using fallback kneeling SVG.");
        // Override the manImg src setter in the timeline by patching the variable.
        // Simplest: replace the src assignment with a fallback.
        // We'll monkey-patch the `src` property of manImg to intercept 'man-kneel.png'
        const originalSrcSetter = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src').set;
        Object.defineProperty(manImg, 'src', {
          set: function(val) {
            if (val === './man-kneel.png') {
              val = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 400'><circle cx='100' cy='70' r='28' fill='%23333'/><rect x='60' y='105' width='80' height='100' rx='20' fill='%23444'/><rect x='50' y='200' width='35' height='120' rx='15' fill='%23222'/><rect x='115' y='200' width='35' height='120' rx='15' fill='%23222'/><rect x='80' y='120' width='40' height='15' fill='%23000'/><rect x='100' y='220' width='30' height='20' fill='%236B4226'/></svg>`;
            }
            originalSrcSetter.call(this, val);
          }
        });
      }
    }, 150);

    // Also handle if walk image is missing – already handled by onerror above
    // But we also need to update manImg if it's already using broken src.
    // The onerror set earlier will replace it.

    // For extra polish: make the form appear even if animation fails.
    // We add a failsafe: if after 10 seconds the form is not shown, show it.
    setTimeout(() => {
      if (!formBox.classList.contains('show')) {
        console.warn("Animation timeout – showing form directly.");
        formBox.classList.add('show');
        floorBag.style.display = 'none';
        manWrap.style.display = 'none';
      }
    }, 10000);

    // Prevent scrolling on touch
    document.body.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
