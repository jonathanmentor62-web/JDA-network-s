<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>JDA Networks · Live Registration</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background: #4A7CFF;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #stage {
      width: 100%;
      height: 100%;
      background: #4A7CFF;
      position: relative;
      overflow: hidden;

      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);

      background-size: 42px 42px;
    }

    /* =========================
       WALKING MAN
       ========================= */

    #manWrap {
      position: absolute;
      bottom: 20px;
      left: -300px;
      width: 280px;
      height: 480px;
      z-index: 10;
      will-change: left, transform;
    }

    #manWrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 15px 20px rgba(0,0,0,0.30));
    }

    #manWrap.walking {
      animation: walkBob 0.35s infinite alternate;
    }

    @keyframes walkBob {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-6px);
      }
    }

    /* =========================
       BAG
       ========================= */

    #floorBag {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);

      width: 110px;
      height: 75px;

      background: #6B4226;
      border-radius: 8px;

      display: none;
      align-items: center;
      justify-content: center;

      color: #F5E6D3;
      font-weight: 900;
      font-size: 20px;

      letter-spacing: 2px;

      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      border: 2px solid #8B5E3C;

      z-index: 5;
    }

    #floorBag span {
      font-weight: 900;
      font-size: 18px;
      color: #F5E6D3;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    /* =========================
       REGISTRATION FORM
       ========================= */

    #formBox {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%) scale(0);

      background: white;

      width: 350px;
      max-width: 92vw;

      border-radius: 24px;

      padding: 26px 24px;

      box-shadow:
        0 30px 80px rgba(0,0,0,0.5);

      z-index: 20;

      opacity: 0;
      pointer-events: none;
    }

    #formBox.show {
      animation:
        pop 0.8s cubic-bezier(0.175,0.885,0.32,1.275)
        forwards;

      pointer-events: auto;
    }

    @keyframes pop {

      0% {
        transform: translate(-50%,-50%) scale(0);
        opacity: 0;
      }

      60% {
        transform: translate(-50%,-50%) scale(1.1);
        opacity: 1;
      }

      100% {
        transform: translate(-50%,-50%) scale(1);
        opacity: 1;
      }
    }

    #formBox h2 {
      text-align: center;
      font-size: 21px;
      font-weight: 750;
      color: #1e293b;
    }

    .subhead {
      text-align: center;

      font-size: 11px;
      color: #6b7280;

      margin: 6px 0 12px;

      font-weight: 600;

      background: #f1f5f9;

      padding: 7px 10px;

      border-radius: 40px;

      width: 100%;
    }

    #formBox input {
      width: 100%;

      padding: 13px 14px;

      border:
        1.5px solid #e5e7eb;

      border-radius: 12px;

      margin-top: 10px;

      font-size: 14px;

      outline: none;

      background: #fafbfc;

      transition:
        border 0.2s,
        box-shadow 0.2s;
    }

    #formBox input:focus {
      border-color: #4A7CFF;

      box-shadow:
        0 0 0 3px rgba(74,124,255,0.18);

      background: white;
    }

    #formBox input[type="file"] {
      padding: 9px 0;

      border: none;

      background: transparent;

      font-size: 13px;

      color: #374151;
    }

    /* =========================
       PHOTO PREVIEW
       ========================= */

    #preview {
      text-align: center;

      margin-top: 8px;

      min-height: 40px;

      display: flex;

      justify-content: center;
    }

    #preview img {
      width: 70px;
      height: 70px;

      border-radius: 50%;

      object-fit: cover;

      border: 3px solid #10b981;

      box-shadow:
        0 4px 10px rgba(0,0,0,0.12);
    }

    /* =========================
       REGISTER BUTTON
       ========================= */

    #registerBtn {
      width: 100%;

      background: #10b981;

      color: white;

      border: none;

      padding: 14px;

      border-radius: 12px;

      margin-top: 18px;

      font-weight: 750;

      font-size: 16px;

      cursor: pointer;

      box-shadow:
        0 6px 14px rgba(16,185,129,0.35);

      transition:
        background 0.15s,
        transform 0.1s;
    }

    #registerBtn:hover {
      background: #0da271;
    }

    #registerBtn:active {
      transform: scale(0.97);
    }

    #registerBtn:disabled {
      background: #9ca3af;

      box-shadow: none;

      cursor: not-allowed;
    }

    /* =========================
       LIVE DOT
       ========================= */

    .live-dot {
      display: inline-block;

      width: 8px;
      height: 8px;

      background: #ef4444;

      border-radius: 50%;

      margin-right: 6px;

      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {

      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.9);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =========================
       STATUS MESSAGE
       ========================= */

    #message {
      display: none;

      margin-top: 12px;

      padding: 10px;

      border-radius: 10px;

      font-size: 12px;

      text-align: center;

      font-weight: 600;
    }

    #message.success {
      display: block;

      background: #dcfce7;

      color: #166534;
    }

    #message.error {
      display: block;

      background: #fee2e2;

      color: #991b1b;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width:480px) {

      #manWrap {
        width: 220px;
        height: 380px;
      }

      #formBox {
        width: 340px;
        padding: 21px 18px;
      }

      #floorBag {
        width: 90px;
        height: 62px;
      }
    }

  </style>
</head>

<body>

<div id="stage">

  <!-- WALKING PERSON -->
  <div id="manWrap">

    <img
      id="manImg"
      src="./man-walk.png"
      alt="JDA Networks"
    >

  </div>


  <!-- JDA BAG -->
  <div id="floorBag">
    <span>JDA</span>
  </div>


  <!-- REGISTRATION -->
  <div id="formBox">

    <h2>
      <span class="live-dot"></span>
      Register now
    </h2>

    <div class="subhead">
      ⚡ Real Name · JDA Number · Photo MUST
    </div>


    <input
      id="realName"
      type="text"
      placeholder="Real Name (No nickname)"
      autocomplete="name"
    >


    <input
      id="jdaNumber"
      type="text"
      placeholder="JDA Number JD-2025-1234"
      maxlength="13"
      style="
        font-family: monospace;
        text-transform: uppercase;
      "
      autocomplete="off"
    >


    <input
      type="file"
      id="photoInput"
      accept="image/jpeg,image/png,image/webp"
    >


    <div id="preview"></div>


    <button id="registerBtn">
      Register & Go Live
    </button>


    <div id="message"></div>

  </div>

</div>


<script type="module">

  /* =========================================================
     FIREBASE
     ========================================================= */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


  import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    getDocs,
    serverTimestamp
  } from
  "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


  import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
  } from
  "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";


  /* =========================================================
     YOUR REAL FIREBASE CONFIG
     ========================================================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAPnOHdVISPw_fGBLdMLELSU9f1IWMTC3I",

    authDomain:
      "jda-network-fabde.firebaseapp.com",

    projectId:
      "jda-network-fabde",

    storageBucket:
      "jda-network-fabde.firebasestorage.app",

    messagingSenderId:
      "383915852673",

    appId:
      "1:383915852673:web:4b185c0387ed0bbad1de80"

  };


  /* =========================================================
     INITIALIZE FIREBASE
     ========================================================= */

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const storage = getStorage(app);


  console.log(
    "🔥 JDA Networks Firebase connected"
  );


  /* =========================================================
     ELEMENTS
     ========================================================= */

  const manWrap =
    document.getElementById("manWrap");

  const manImg =
    document.getElementById("manImg");

  const floorBag =
    document.getElementById("floorBag");

  const formBox =
    document.getElementById("formBox");

  const realName =
    document.getElementById("realName");

  const jdaNumber =
    document.getElementById("jdaNumber");

  const photoInput =
    document.getElementById("photoInput");

  const preview =
    document.getElementById("preview");

  const registerBtn =
    document.getElementById("registerBtn");

  const message =
    document.getElementById("message");


  /* =========================================================
     MESSAGE FUNCTION
     ========================================================= */

  function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

  }


  /* =========================================================
     PHOTO PREVIEW
     ========================================================= */

  let selectedPhoto = null;


  photoInput.addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];


      if (!file) {

        selectedPhoto = null;

        preview.innerHTML = "";

        return;
      }


      /* Maximum 5 MB */

      if (file.size > 5 * 1024 * 1024) {

        alert(
          "Photo is too large. Please choose a photo under 5 MB."
        );

        photoInput.value = "";

        selectedPhoto = null;

        preview.innerHTML = "";

        return;
      }


      selectedPhoto = file;


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          preview.innerHTML =
            `<img src="${e.target.result}"
                  alt="Profile preview">`;

        };


      reader.readAsDataURL(file);

    }
  );


  /* =========================================================
     JDA NUMBER FORMAT
     ========================================================= */

  jdaNumber.addEventListener(
    "input",
    function() {

      this.value =
        this.value.toUpperCase();

    }
  );


  /* =========================================================
     REGISTRATION
     ========================================================= */

  registerBtn.addEventListener(
    "click",
    async function() {

      const name =
        realName.value.trim();


      const jda =
        jdaNumber.value.trim().toUpperCase();


      /* -------------------------
         VALIDATION
         ------------------------- */

      if (!name) {

        showMessage(
          "Please enter your real name.",
          "error"
        );

        return;
      }


      if (!jda) {

        showMessage(
          "Please enter your JDA Number.",
          "error"
        );

        return;
      }


      const jdaPattern =
        /^JD-\d{4}-\d{4}$/;


      if (!jdaPattern.test(jda)) {

        showMessage(
          "JDA Number must look like JD-2025-1234.",
          "error"
        );

        return;
      }


      if (!selectedPhoto) {

        showMessage(
          "Please select your profile photo.",
          "error"
        );

        return;
      }


      /* -------------------------
         DISABLE BUTTON
         ------------------------- */

      registerBtn.disabled = true;

      registerBtn.textContent =
        "Checking JDA Number...";


      try {

        /* =====================================================
           CHECK DUPLICATE JDA NUMBER
           ===================================================== */

        const existingQuery =
          query(
            collection(db, "jda_users_v2"),
            where("jdaNumber", "==", jda)
          );


        const existing =
          await getDocs(existingQuery);


        if (!existing.empty) {

          showMessage(
            "This JDA Number is already registered.",
            "error"
          );

          registerBtn.disabled = false;

          registerBtn.textContent =
            "Register & Go Live";

          return;
        }


        /* =====================================================
           UPLOAD PHOTO TO FIREBASE STORAGE
           ===================================================== */

        registerBtn.textContent =
          "Uploading photo...";


        const safeName =
          name
            .replace(/[^a-zA-Z0-9]/g, "_")
            .substring(0, 30);


        const fileExtension =
          selectedPhoto.name
            .split(".")
            .pop();


        const storagePath =
          `jda_profiles/${jda}_${safeName}.${fileExtension}`;


        const photoRef =
          ref(storage, storagePath);


        await uploadBytes(
          photoRef,
          selectedPhoto
        );


        /* =====================================================
           GET PHOTO URL
           ===================================================== */

        registerBtn.textContent =
          "Creating account...";


        const photoURL =
          await getDownloadURL(photoRef);


        /* =====================================================
           SAVE REGISTRATION TO FIRESTORE
           ===================================================== */

        await addDoc(
          collection(db, "jda_users_v2"),
          {

            realName: name,

            jdaNumber: jda,

            profilePhoto: photoURL,

            status: "pending",

            approved: false,

            createdAt: serverTimestamp(),

            updatedAt: serverTimestamp()

          }
        );


        /* =====================================================
           SUCCESS
           ===================================================== */

        showMessage(
          "✓ Registration sent! Your account is waiting for admin approval.",
          "success"
        );


        registerBtn.textContent =
          "Registration Submitted";


        registerBtn.disabled = true;


        realName.disabled = true;

        jdaNumber.disabled = true;

        photoInput.disabled = true;


        /* Give the user time to read message */

        setTimeout(
          function() {

            alert(
              "✓ JDA Networks registration successful!\n\n" +
              "Your registration has been sent to the admin.\n\n" +
              "You can use JDA Networks after your account is approved."
            );

          },
          500
        );


      } catch (error) {

        console.error(
          "JDA registration error:",
          error
        );


        let errorText =
          "Registration failed.";


        if (
          error.code ===
          "storage/unauthorized"
        ) {

          errorText =
            "Photo upload was blocked by Firebase Storage rules.";

        } else if (
          error.code ===
          "permission-denied"
        ) {

          errorText =
            "Firebase Firestore permission denied.";

        } else if (
          error.code ===
          "storage/quota-exceeded"
        ) {

          errorText =
            "Firebase Storage quota has been exceeded.";

        } else if (
          error.message
        ) {

          errorText =
            error.message;

        }


        showMessage(
          "⚠️ " + errorText,
          "error"
        );


        registerBtn.disabled = false;

        registerBtn.textContent =
          "Register & Go Live";

      }

    }
  );


  /* =========================================================
     ANIMATION
     ========================================================= */

  let x = -300;

  const targetX =
    window.innerWidth / 2 - 140;


  manWrap.classList.add(
    "walking"
  );


  const walkIn =
    setInterval(
      function() {

        x += 5;

        manWrap.style.left =
          x + "px";


        if (x >= targetX) {

          clearInterval(walkIn);


          /* Kneel */

          manWrap.classList.remove(
            "walking"
          );


          manImg.src =
            "./man-kneel.png";


          manWrap.style.transform =
            "scale(1.1)";


          manWrap.style.bottom =
            "10px";


          setTimeout(
            function() {

              /* Put down bag */

              floorBag.style.display =
                "flex";


              floorBag.style.left =
                (targetX + 90) + "px";


              floorBag.style.transform =
                "translateX(0)";


              floorBag.style.bottom =
                "80px";


              setTimeout(
                function() {

                  /* Stand */

                  manImg.src =
                    "./man-walk.png";


                  manWrap.style.transform =
                    "scale(1)";


                  manWrap.style.bottom =
                    "20px";


                  setTimeout(
                    function() {

                      /* Bag becomes form */

                      floorBag.style.transition =
                        "all 0.6s cubic-bezier(0.175,0.885,0.32,1.275)";


                      floorBag.style.transform =
                        "translateX(-50%) scale(3.5)";


                      floorBag.style.opacity =
                        "0";


                      floorBag.style.left =
                        "50%";


                      setTimeout(
                        function() {

                          formBox.classList.add(
                            "show"
                          );


                          floorBag.style.display =
                            "none";


                          /* Walk out */

                          let x2 =
                            targetX;


                          manWrap.classList.add(
                            "walking"
                          );


                          const walkOut =
                            setInterval(
                              function() {

                                x2 += 6;

                                manWrap.style.left =
                                  x2 + "px";


                                if (
                                  x2 >
                                  window.innerWidth + 100
                                ) {

                                  clearInterval(
                                    walkOut
                                  );


                                  manWrap.style.display =
                                    "none";

                                }

                              },
                              16
                            );

                        },
                        400
                      );

                    },
                    600
                  );

                },
                500
              );

            },
            900
          );

        }

      },
      16
    );


  /* =========================================================
     IMAGE FALLBACKS
     ========================================================= */

  const walkImage =
    new Image();

  walkImage.src =
    "./man-walk.png";


  walkImage.onerror =
    function() {

      manImg.src =
        "data:image/svg+xml;utf8," +
        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 400'>" +
        "<circle cx='100' cy='70' r='28' fill='%23333'/>" +
        "<rect x='70' y='105' width='60' height='120' rx='20' fill='%23444'/>" +
        "<rect x='50' y='230' width='35' height='110' rx='15' fill='%23222'/>" +
        "<rect x='115' y='230' width='35' height='110' rx='15' fill='%23222'/>" +
        "</svg>";

    };


  /* =========================================================
     FORM FAILSAFE
     ========================================================= */

  setTimeout(
    function() {

      if (
        !formBox.classList.contains(
          "show"
        )
      ) {

        formBox.classList.add(
          "show"
        );

        floorBag.style.display =
          "none";

        manWrap.style.display =
          "none";

      }

    },
    10000
  );


  /* =========================================================
     PREVENT MOBILE SCROLL
     ========================================================= */

  document.body.addEventListener(
    "touchmove",
    function(e) {

      e.preventDefault();

    },
    {
      passive: false
    }
  );

</script>

</body>
</html>
