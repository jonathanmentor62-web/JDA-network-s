<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JDA Networks - Live</title>
<style>
body{margin:0;background:#3B82F6;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:sans-serif;overflow:hidden}
.char{position:absolute;font-size:50px;animation:bounce 1s infinite}
.c1{top:60px;left:20px}.c2{top:60px;right:20px;animation-delay:0.3s}
.card{background:white;width:340px;border-radius:28px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,0.4);z-index:10;animation:pop 0.6s ease}
input{width:100%;background:#F1F5F9;border:none;padding:14px;border-radius:12px;margin-top:12px;box-sizing:border-box;outline:none}
label{margin-top:12px;border:2px dashed #ccc;border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:#F8FAFC}
button{width:100%;background:black;color:white;padding:14px;border:none;border-radius:12px;margin-top:16px;font-weight:bold;cursor:pointer}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="char c1">🧑‍💻</div>
<div class="char c2">👩‍💻</div>
<div class="card">
<div style="width:60px;height:60px;background:#25D366;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:auto;color:white;font-weight:900;font-size:30px">J</div>
<h2 style="text-align:center;margin:10px 0 0">JDA Networks</h2>
<p style="text-align:center;font-size:10px;color:gray;margin:0">LIVE • NO SCHOOL • REAL ONLY</p>
<input id="realName" placeholder="Real Name (No nickname)" />
<input id="jdaNumber" placeholder="JDA Number JD-2025-XXXX" style="font-family:monospace" />
<label>
<div id="photoPreview" style="text-align:center">📸<br><b style="font-size:11px">Profile Photo MUST</b><br><span style="font-size:9px;color:red">No photo = No approval</span></div>
<input type="file" id="photoInput" accept="image/*" style="display:none" />
</label>
<button id="registerBtn">Register & Go Live 🚀</button>
<p style="font-size:8px;text-align:center;color:#aaa;margin-top:10px">Once only • Real photo • Admin approves</p>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
