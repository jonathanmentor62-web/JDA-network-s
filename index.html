here<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>JDA Networks</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #efeae2;
  color: #111b21;
  max-width: 600px;
  margin: auto;
  min-height: 100vh;
}

button,
input {
  font: inherit;
}

button {
  border: none;
  cursor: pointer;
}

/* MAIN APP */

#app {
  min-height: 100vh;
  background: #fff;
}

/* HEADER */

.header {
  background: #008f7a;
  color: white;
  padding: 18px 16px 0;
  position: sticky;
  top: 0;
  z-index: 20;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 48px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.header-icons {
  display: flex;
  gap: 22px;
  font-size: 23px;
}

.icon-button {
  background: transparent;
  color: white;
  font-size: 22px;
}

/* TABS */

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  margin-top: 12px;
}

.tab {
  color: #d9f4ee;
  background: transparent;
  padding: 14px 5px;
  font-weight: bold;
  font-size: 15px;
  border-bottom: 3px solid transparent;
}

.tab.active {
  color: white;
  border-bottom-color: white;
}

/* SEARCH */

.search-area {
  background: #f6f6f6;
  padding: 10px 14px;
}

.search-box {
  background: white;
  border-radius: 24px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  height: 46px;
}

.search-box span {
  font-size: 19px;
  margin-right: 10px;
  color: #667781;
}

.search-box input {
  border: none;
  outline: none;
  width: 100%;
  font-size: 16px;
}

/* CONTENT */

.content {
  min-height: calc(100vh - 150px);
  background: white;
}

.empty {
  text-align: center;
  padding: 90px 25px;
  color: #667781;
}

.empty-icon {
  font-size: 65px;
  margin-bottom: 15px;
}

.empty h2 {
  color: #41525d;
  font-size: 20px;
  margin-bottom: 8px;
}

.empty p {
  font-size: 15px;
}

/* CHAT LIST */

.chat-list {
  background: white;
}

.chat-item {
  display: flex;
  align-items: center;
  padding: 12px 15px;
  border-bottom: 1px solid #eee;
  min-height: 75px;
}

.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #00a884;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  font-weight: bold;
  flex-shrink: 0;
  margin-right: 13px;
}

.chat-info {
  flex: 1;
  min-width: 0;
}

.chat-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.chat-name {
  font-size: 17px;
  font-weight: 500;
}

.chat-time {
  font-size: 12px;
  color: #667781;
}

.chat-preview {
  margin-top: 6px;
  color: #667781;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.unread {
  background: #25d366;
  color: white;
  border-radius: 50%;
  min-width: 20px;
  height: 20px;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 4px;
}

/* CONTACTS */

.contacts {
  padding-bottom: 30px;
}

.contact-title {
  background: #f0f2f5;
  color: #667781;
  padding: 9px 16px;
  font-size: 13px;
  font-weight: bold;
}

.contact-item {
  display: flex;
  align-items: center;
  padding: 13px 15px;
  border-bottom: 1px solid #eee;
}

.contact-info {
  flex: 1;
}

.contact-name {
  font-size: 17px;
}

.contact-number {
  color: #667781;
  font-size: 14px;
  margin-top: 4px;
}

.chat-contact-btn {
  background: #00a884;
  color: white;
  border-radius: 22px;
  padding: 9px 15px;
}

/* ADD MEMBER */

.add-member {
  padding: 20px;
  background: #f0f2f5;
}

.add-title {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 15px;
}

.form-input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccd1d5;
  border-radius: 8px;
  margin-bottom: 10px;
  outline: none;
  background: white;
}

.save-btn {
  background: #00a884;
  color: white;
  padding: 13px 20px;
  border-radius: 25px;
  font-weight: bold;
}

/* CHAT SCREEN */

#chatScreen {
  display: none;
  position: fixed;
  inset: 0;
  max-width: 600px;
  margin: auto;
  background: #efeae2;
  z-index: 100;
  flex-direction: column;
}

.chat-header {
  height: 65px;
  background: #008f7a;
  color: white;
  display: flex;
  align-items: center;
  padding: 7px 10px;
}

.back-btn {
  background: transparent;
  color: white;
  font-size: 28px;
  width: 40px;
}

.chat-avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: #d9fdd3;
  color: #008f7a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  margin-right: 10px;
}

.chat-header-info {
  flex: 1;
}

.chat-header-name {
  font-size: 17px;
  font-weight: bold;
}

.chat-status {
  font-size: 12px;
  margin-top: 3px;
  color: #d9fdd3;
}

.chat-header-icons {
  display: flex;
  gap: 17px;
  font-size: 20px;
}

/* MESSAGES */

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px 10px;
  background-color: #efeae2;
}

.date-label {
  text-align: center;
  margin: 5px auto 15px;
  background: #fff;
  color: #667781;
  width: fit-content;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  box-shadow: 0 1px 1px #ddd;
}

.message-row {
  display: flex;
  margin-bottom: 7px;
}

.message-row.sent {
  justify-content: flex-end;
}

.message {
  max-width: 78%;
  padding: 8px 9px 5px;
  border-radius: 8px;
  font-size: 15px;
  line-height: 1.35;
  position: relative;
  box-shadow: 0 1px 1px rgba(0,0,0,.12);
}

.received .message {
  background: white;
  border-top-left-radius: 2px;
}

.sent .message {
  background: #d9fdd3;
  border-top-right-radius: 2px;
}

.message-ouma Jonathan {
  float: right;
  margin-left: 12px;
  margin-top: 5px;
  font-size: 10px;
  color: #667781;
}

.ticks {
  color: #53bdeb;
  margin-left: 3px;
}

/* MESSAGE INPUT */

.message-area {
  background: #f0f2f5;
  padding: 7px 8px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.message-icon {
  background: transparent;
  color: #54656f;
  font-size: 23px;
  width: 34px;
}

.message-input {
  flex: 1;
  background: white;
  border: none;
  outline: none;
  border-radius: 24px;
  padding: 12px 15px;
  min-width: 0;
}

.send-btn {
  width: 46px;
  height: 46px;
  background: #00a884;
  color: white;
  border-radius: 50%;
  font-size: 20px;
}

/* CALLS */

.call-item {
  display: flex;
  align-items: center;
  padding: 15px;
  border-bottom: 1px solid #eee;
}

.call-icon {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #00a884;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 13px;
}

.call-info {
  flex: 1;
}

.call-name {
  font-size: 17px;
}

.call-time {
  color: #667781;
  font-size: 13px;
  margin-top: 4px;
}

/* UPDATES */

.status-item {
  display: flex;
  align-items: center;
  padding: 15px;
  border-bottom: 1px solid #eee;
}

.status-ring {
  width: 52px;
  height: 52px;
  border: 3px solid #00a884;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 13px;
}

.status-ring div {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* RESPONSIVE */

@media (max-width: 400px) {
  .logo {
    font-size: 21px;
  }

  .message {
    max-width: 84%;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- MAIN HEADER -->
  <header class="header">
    <div class="topbar">
      <div class="logo">JDA Networks</div>

      <div class="header-icons">
        <button class="icon-button" onclick="focusSearch()">🔍</button>
        <button class="icon-button" onclick="showMenu()">⋮</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('chats', this)">CHATS</button>
      <button class="tab" onclick="showTab('updates', this)">UPDATES</button>
      <button class="tab" onclick="showTab('calls', this)">CALLS</button>
    </div>
  </header>

  <!-- SEARCH -->
  <div class="search-area">
    <div class="search-box">
      <span>🔍</span>
      <input
        id="searchInput"
        type="text"
        placeholder="Search chats"
        oninput="searchMembers()"
      >
    </div>
  </div>

  <!-- CONTENT -->
  <main id="content" class="content"></main>

</div>


<!-- CHAT SCREEN -->
<div id="chatScreen">

  <div class="chat-header">

    <button class="back-btn" onclick="closeChat()">‹</button>

    <div class="chat-avatar" id="chatAvatar">J</div>

    <div class="chat-header-info">
      <div class="chat-header-name" id="chatName">Member</div>
      <div class="chat-status" id="chatStatus">offline</div>
    </div>

    <div class="chat-header-icons">
      <span>📹</span>
      <span>📞</span>
      <span>⋮</span>
    </div>

  </div>

  <div class="messages" id="messages"></div>

  <div class="message-area">

    <button class="message-icon" onclick="addEmoji()">😊</button>

    <input
      id="messageInput"
      class="message-input"
      type="text"
      placeholder="Message"
      onkeydown="handleEnter(event)"
    >

    <button class="message-icon">📎</button>

    <button class="send-btn" onclick="sendMessage()">➤</button>

  </div>

</div>


<script>

/* =========================
   DATA
========================= */

let members = JSON.parse(localStorage.getItem("jdaMembers")) || [];

let chats = JSON.parse(localStorage.getItem("jdaChats")) || {};

let currentMember = null;


/* =========================
   SAVE DATA
========================= */

function saveData() {
  localStorage.setItem("jdaMembers", JSON.stringify(members));
  localStorage.setItem("jdaChats", JSON.stringify(chats));
}


/* =========================
   INITIAL PAGE
========================= */

function renderChats() {

  const content = document.getElementById("content");

  if (members.length === 0) {

    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">💬</div>
        <h2>No chats yet</h2>
        <p>Add a member to start chatting.</p>
      </div>

      <div class="add-member">
        <div class="add-title">Add New Member</div>

        <input
          id="memberName"
          class="form-input"
          placeholder="Member name"
        >

        <input
          id="memberNumber"
          class="form-input"
          placeholder="Mobile number"
          type="tel"
        >

        <button class="save-btn" onclick="addMember()">
          + Add Member
        </button>
      </div>
    `;

    return;
  }

  let html = `<div class="chat-list">`;

  members.forEach((member, index) => {

    const memberChats = chats[member.id] || [];

    const lastMessage =
      memberChats.length > 0
        ? memberChats[memberChats.length - 1].text
        : "Tap to start chatting";

    html += `
      <div class="chat-item" onclick="openChat('${member.id}')">

        <div class="avatar">
          ${getInitial(member.name)}
        </div>

        <div class="chat-info">

          <div class="chat-top">
            <div class="chat-name">${escapeHTML(member.name)}</div>

            <div class="chat-time">
              ${memberChats.length ? memberChats[memberChats.length - 1].time : ""}
            </div>
          </div>

          <div class="chat-preview">
            ${escapeHTML(lastMessage)}
          </div>

        </div>

      </div>
    `;
  });

  html += `</div>`;

  html += `
    <div class="add-member">
      <div class="add-title">Add New Member</div>

      <input
        id="memberName"
        class="form-input"
        placeholder="Member name"
      >

      <input
        id="memberNumber"
        class="form-input"
        placeholder="Mobile number"
        type="tel"
      >

      <button class="save-btn" onclick="addMember()">
        + Add Member
      </button>
    </div>
  `;

  content.innerHTML = html;
}


/* =========================
   ADD MEMBER
========================= */

function addMember() {

  const nameInput = document.getElementById("memberName");
  const numberInput = document.getElementById("memberNumber");

  const name = nameInput.value.trim();
  const number = numberInput.value.trim();

  if (!name || !number) {
    alert("Please enter the member name and mobile number.");
    return;
  }

  const id = Date.now().toString();

  const member = {
    id: id,
    name: name,
    number: number,
    online: false
  };

  members.push(member);

  chats[id] = [];

  saveData();

  renderChats();

  alert(name + " was added successfully.");
}


/* =========================
   OPEN CHAT
========================= */

function openChat(id) {

  currentMember = members.find(member => member.id === id);

  if (!currentMember) return;

  document.getElementById("chatScreen").style.display = "flex";

  document.getElementById("chatName").textContent =
    currentMember.name;

  document.getElementById("chatAvatar").textContent =
    getInitial(currentMember.name);

  document.getElementById("chatStatus").textContent =
    currentMember.online ? "online" : "offline";

  renderMessages();

  setTimeout(() => {
    document.getElementById("messageInput").focus();
  }, 200);
}


/* =========================
   CLOSE CHAT
========================= */

function closeChat() {

  document.getElementById("chatScreen").style.display = "none";

  currentMember = null;

  renderChats();
}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages() {

  const messagesBox = document.getElementById("messages");

  const memberChats = chats[currentMember.id] || [];

  let html = `
    <div class="date-label">Today</div>
  `;

  if (memberChats.length === 0) {

    html += `
      <div style="
        text-align:center;
        color:#667781;
        padding:50px 20px;
        font-size:14px;
      ">
        🔒 Messages are stored on this device.
        <br><br>
        Say hello to ${escapeHTML(currentMember.name)}.
      </div>
    `;

  } else {

    memberChats.forEach(message => {

      const side = message.sender === "me"
        ? "sent"
        : "received";

      html += `
        <div class="message-row ${side}">
          <div class="message">

            ${escapeHTML(message.text)}

            <span class="message-meta">
              ${message.time}

              ${
                message.sender === "me"
                  ? `<span class="ticks">✓✓</span>`
                  : ""
              }
            </span>

          </div>
        </div>
      `;
    });
  }

  messagesBox.innerHTML = html;

  messagesBox.scrollTop = messagesBox.scrollHeight;
}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage() {

  const input = document.getElementById("messageInput");

  const text = input.value.trim();

  if (!text || !currentMember) return;

  if (!chats[currentMember.id]) {
    chats[currentMember.id] = [];
  }

  chats[currentMember.id].push({
    sender: "me",
    text: text,
    time: getTime()
  });

  saveData();

  input.value = "";

  renderMessages();

  /*
    Demo reply.
    This makes the app feel like a real chat.
    Later we can connect it to a real backend.
  */

  setTimeout(() => {

    if (!currentMember) return;

    chats[currentMember.id].push({
      sender: "them",
      text: "Thanks for your message.",
      time: getTime()
    });

    saveData();

    renderMessages();

  }, 1200);
}


/* =========================
   ENTER TO SEND
========================= */

function handleEnter(event) {

  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
}


/* =========================
   EMOJI
========================= */

function addEmoji() {

  const input = document.getElementById("messageInput");

  input.value += " 😊";

  input.focus();
}


/* =========================
   SEARCH
========================= */

function searchMembers() {

  const search =
    document.getElementById("searchInput").value
      .toLowerCase()
      .trim();

  if (!search) {
    renderChats();
    return;
  }

  const content = document.getElementById("content");

  const results = members.filter(member =>
    member.name.toLowerCase().includes(search) ||
    member.number.includes(search)
  );

  if (results.length === 0) {

    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <h2>No results</h2>
        <p>No members found.</p>
      </div>
    `;

    return;
  }

  let html = `<div class="chat-list">`;

  results.forEach(member => {

    html += `
      <div class="chat-item"
           onclick="openChat('${member.id}')">

        <div class="avatar">
          ${getInitial(member.name)}
        </div>

        <div class="chat-info">

          <div class="chat-name">
            ${escapeHTML(member.name)}
          </div>

          <div class="chat-preview">
            ${escapeHTML(member.number)}
          </div>

        </div>

      </div>
    `;
  });

  html += `</div>`;

  content.innerHTML = html;
}


/* =========================
   TABS
========================= */

function showTab(tab, button) {

  document.querySelectorAll(".tab").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  if (tab === "chats") {
    document.getElementById("searchInput").placeholder =
      "Search chats";

    renderChats();
  }

  if (tab === "updates") {

    document.getElementById("searchInput").placeholder =
      "Search updates";

    document.getElementById("content").innerHTML = `

      <div class="status-item">

        <div class="status-ring">
          <div>➕</div>
        </div>

        <div>
          <strong>My status</strong>
          <div style="color:#667781;margin-top:4px">
            Add a status update
          </div>
        </div>

      </div>

      <div class="contact-title">
        Recent updates
      </div>

      <div class="empty" style="padding-top:60px">
        <div class="empty-icon">⭕</div>
        <h2>No recent updates</h2>
        <p>Updates from your contacts will appear here.</p>
      </div>

    `;
  }

  if (tab === "calls") {

    document.getElementById("searchInput").placeholder =
      "Search calls";

    if (members.length === 0) {

      document.getElementById("content").innerHTML = `
        <div class="empty">
          <div class="empty-icon">📞</div>
          <h2>No calls yet</h2>
          <p>Your calls will appear here.</p>
        </div>
      `;

      return;
    }

    let html = `<div>`;

    members.forEach(member => {

      html += `
        <div class="call-item">

          <div class="call-icon">📞</div>

          <div class="call-info">

            <div class="call-name">
              ${escapeHTML(member.name)}
            </div>

            <div class="call-time">
              📞 No calls yet
            </div>

          </div>

          <button
            onclick="openChat('${member.id}')"
            style="
              background:transparent;
              font-size:21px;
            "
          >
            📞
          </button>

        </div>
      `;
    });

    html += `</div>`;

    document.getElementById("content").innerHTML = html;
  }
}


/* =========================
   SEARCH BUTTON
========================= */

function focusSearch() {

  const input = document.getElementById("searchInput");

  input.focus();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================
   MENU
========================= */

function showMenu() {

  alert(
    "JDA Networks\n\n" +
    "• New group\n" +
    "• Settings\n" +
    "• Privacy\n" +
    "• Help"
  );
}


/* =========================
   HELPERS
========================= */

function getInitial(name) {

  return name
    .trim()
    .charAt(0)
    .toUpperCase();
}


function getTime() {

  const now = new Date();

  return now.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}


function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* =========================
   START APP
========================= */

renderChats();

</script>

</body>
  </html>
