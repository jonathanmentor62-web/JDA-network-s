<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JDA Networks</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #e9eef5;
  color: #172033;
}

.app {
  max-width: 600px;
  margin: auto;
  min-height: 100vh;
  background: white;
  box-shadow: 0 0 20px rgba(0,0,0,.12);
}

/* TOP BAR */
.topbar {
  background: #075e54;
  color: white;
  padding: 18px 16px 10px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.top-icons {
  display: flex;
  gap: 20px;
  font-size: 22px;
}

/* TABS */
.tabs {
  display: flex;
  margin-top: 18px;
}

.tab {
  flex: 1;
  text-align: center;
  padding: 12px 5px;
  font-weight: bold;
  color: #d7ebe8;
  cursor: pointer;
}

.tab.active {
  color: white;
  border-bottom: 3px solid white;
}

/* SEARCH */
.search {
  padding: 10px;
  background: #f5f5f5;
}

.search input {
  width: 100%;
  border: none;
  border-radius: 25px;
  padding: 13px 18px;
  font-size: 16px;
  outline: none;
}

/* CHAT LIST */
.chat-list {
  background: white;
}

.chat {
  display: flex;
  align-items: center;
  padding: 14px 15px;
  border-bottom: 1px solid #eeeeee;
  cursor: pointer;
}

.avatar {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: #128c7e;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
  margin-right: 14px;
}

.chat-info {
  flex: 1;
  min-width: 0;
}

.chat-top {
  display: flex;
  justify-content: space-between;
}

.name {
  font-size: 17px;
  font-weight: bold;
}

.time {
  color: #777;
  font-size: 12px;
}

.last-message {
  margin-top: 6px;
  color: #777;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.empty {
  padding: 60px 25px;
  text-align: center;
  color: #777;
}

/* ADD MEMBER */
.add-section {
  padding: 20px;
  background: #f5f7fa;
}

.add-btn {
  width: 100%;
  background: #128c7e;
  color: white;
  border: none;
  padding: 15px;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.form {
  display: none;
  background: white;
  padding: 20px;
  margin-top: 15px;
  border-radius: 10px;
}

.form input {
  width: 100%;
  padding: 14px;
  margin: 8px 0 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

.save-btn {
  width: 100%;
  background: #075e54;
  color: white;
  border: none;
  padding: 14px;
  border-radius: 8px;
  font-size: 16px;
}

/* CHAT SCREEN */
.chat-screen {
  display: none;
  height: 100vh;
  background: #efe7de;
  position: relative;
}

.chat-header {
  background: #075e54;
  color: white;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 5;
}

.back {
  font-size: 28px;
  cursor: pointer;
}

.header-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #128c7e;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
}

.header-info {
  flex: 1;
}

.header-name {
  font-weight: bold;
  font-size: 17px;
}

.status {
  font-size: 12px;
  opacity: .9;
}

/* MESSAGES */
.messages {
  padding: 20px 12px 90px;
  min-height: calc(100vh - 70px);
  overflow-y: auto;
}

.message {
  max-width: 78%;
  padding: 9px 12px;
  margin-bottom: 8px;
  border-radius: 8px;
  font-size: 15px;
  position: relative;
  clear: both;
}

.received {
  background: white;
  float: left;
}

.sent {
  background: #d9fdd3;
  float: right;
}

.message-time {
  font-size: 10px;
  color: #777;
  float: right;
  margin-left: 10px;
  margin-top: 5px;
}

/* MESSAGE INPUT */
.message-box {
  position: fixed;
  bottom: 0;
  width: 100%;
  max-width: 600px;
  background: #f0f0f0;
  padding: 8px;
  display: flex;
  gap: 7px;
}

.message-box input {
  flex: 1;
  border: none;
  border-radius: 25px;
  padding: 13px 16px;
  font-size: 16px;
  outline: none;
}

.send {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: #128c7e;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

/* DESKTOP */
@media (min-width: 601px) {
  .message-box {
    left: 50%;
    transform: translateX(-50%);
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HOME SCREEN -->
  <div id="homeScreen">

    <div class="topbar">
      <div class="top-row">
        <div class="logo">JDA Networks</div>
        <div class="top-icons">
          <span>🔍</span>
          <span>⋮</span>
        </div>
      </div>

      <div class="tabs">
        <div class="tab active">CHATS</div>
        <div class="tab">GROUPS</div>
        <div class="tab">CALLS</div>
      </div>
    </div>

    <div class="search">
      <input
        type="text"
        id="searchInput"
        placeholder="Search chats"
        oninput="searchMembers()">
    </div>

    <div id="chatList" class="chat-list"></div>

    <div class="add-section">
      <button class="add-btn" onclick="showForm()">
        ＋ Add Member
      </button>

      <div id="memberForm" class="form">
        <h2>Add New Member</h2>

        <input
          type="text"
          id="memberName"
          placeholder="Member name">

        <input
          type="tel"
          id="memberPhone"
          placeholder="Mobile number">

        <button class="save-btn" onclick="addMember()">
          Save Member
        </button>
      </div>
    </div>

  </div>


  <!-- CHAT SCREEN -->
  <div id="chatScreen" class="chat-screen">

    <div class="chat-header">

      <span class="back" onclick="closeChat()">‹</span>

      <div class="header-avatar" id="headerAvatar">?</div>

      <div class="header-info">
        <div class="header-name" id="headerName">
          Member
        </div>

        <div class="status" id="headerStatus">
          offline
        </div>
      </div>

      <span style="font-size:22px;">📞</span>
      <span style="font-size:22px;">⋮</span>

    </div>

    <div id="messages" class="messages"></div>

    <div class="message-box">

      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
        onkeydown="if(event.key==='Enter') sendMessage()">

      <button class="send" onclick="sendMessage()">
        ➤
      </button>

    </div>

  </div>

</div>


<script>

let members = JSON.parse(
  localStorage.getItem("jdaMembers") || "[]"
);

let currentMember = null;


/* DISPLAY MEMBERS */
function displayMembers(list = members) {

  const chatList = document.getElementById("chatList");

  chatList.innerHTML = "";

  if (list.length === 0) {

    chatList.innerHTML = `
      <div class="empty">
        <div style="font-size:50px;">💬</div>
        <h3>No chats yet</h3>
        <p>Add a member to start chatting.</p>
      </div>
    `;

    return;
  }

  list.forEach((member, index) => {

    const firstLetter =
      member.name.charAt(0).toUpperCase();

    const chat = document.createElement("div");

    chat.className = "chat";

    chat.onclick = () => openChat(index);

    chat.innerHTML = `

      <div class="avatar">
        ${firstLetter}
      </div>

      <div class="chat-info">

        <div class="chat-top">

          <div class="name">
            ${escapeHTML(member.name)}
          </div>

          <div class="time">
            ${member.time || ""}
          </div>

        </div>

        <div class="last-message">
          ${escapeHTML(member.lastMessage || "Tap to start chatting")}
        </div>

      </div>
    `;

    chatList.appendChild(chat);

  });
}


/* ADD MEMBER */
function showForm() {

  const form =
    document.getElementById("memberForm");

  form.style.display =
    form.style.display === "block"
      ? "none"
      : "block";
}


function addMember() {

  const name =
    document.getElementById("memberName").value.trim();

  const phone =
    document.getElementById("memberPhone").value.trim();

  if (!name || !phone) {

    alert("Please enter the member name and mobile number.");

    return;
  }

  members.push({

    name: name,

    phone: phone,

    lastMessage: "New member",

    time: new Date().toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    }),

    messages: []

  });

  localStorage.setItem(
    "jdaMembers",
    JSON.stringify(members)
  );

  document.getElementById("memberName").value = "";
  document.getElementById("memberPhone").value = "";

  document.getElementById("memberForm").style.display = "none";

  displayMembers();

}


/* OPEN CHAT */
function openChat(index) {

  currentMember = members[index];

  document.getElementById("homeScreen")
    .style.display = "none";

  document.getElementById("chatScreen")
    .style.display = "block";

  document.getElementById("headerName")
    .textContent = currentMember.name;

  document.getElementById("headerAvatar")
    .textContent =
    currentMember.name.charAt(0).toUpperCase();

  document.getElementById("headerStatus")
    .textContent = "offline";

  displayMessages();

}


/* CLOSE CHAT */
function closeChat() {

  document.getElementById("chatScreen")
    .style.display = "none";

  document.getElementById("homeScreen")
    .style.display = "block";

  displayMembers();

}


/* DISPLAY MESSAGES */
function displayMessages() {

  const container =
    document.getElementById("messages");

  container.innerHTML = "";

  if (!currentMember.messages ||
      currentMember.messages.length === 0) {

    container.innerHTML = `
      <div style="
        text-align:center;
        color:#777;
        margin-top:30px;
        font-size:14px;">
        🔒 Messages are stored on this device.
      </div>
    `;

    return;
  }

  currentMember.messages.forEach(message => {

    const div =
      document.createElement("div");

    div.className =
      "message " +
      (message.sent ? "sent" : "received");

    div.innerHTML =
      escapeHTML(message.text) +
      `<span class="message-time">
        ${message.time}
      </span>`;

    container.appendChild(div);

  });

  container.scrollTop =
    container.scrollHeight;
}


/* SEND MESSAGE */
function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if (!text || !currentMember) return;

  if (!currentMember.messages) {
    currentMember.messages = [];
  }

  const now =
    new Date().toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });

  currentMember.messages.push({

    text: text,

    sent: true,

    time: now

  });

  currentMember.lastMessage = text;

  currentMember.time = now;

  const index =
    members.indexOf(currentMember);

  members[index] = currentMember;

  localStorage.setItem(
    "jdaMembers",
    JSON.stringify(members)
  );

  input.value = "";

  displayMessages();

}


/* SEARCH */
function searchMembers() {

  const query =
    document.getElementById("searchInput")
      .value
      .toLowerCase();

  const results =
    members.filter(member =>
      member.name.toLowerCase().includes(query)
    );

  displayMembers(results);
}


/* SECURITY */
function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* START */
displayMembers();

</script>

</body>
  </html>
