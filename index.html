<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JDA Networks - Fixed</title>
<style>
/* KEEP YOUR SAME CSS - NO CHANGE */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b141a; color: #e9edef; height: 100vh; overflow: hidden; }
.hidden { display: none!important; }
#authScreen { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #0b141a; }
.authBox { width: 100%; max-width: 420px; background: #1f2c33; padding: 40px 32px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.authBox.logo { text-align: center; margin-bottom: 30px; }
.authBox.logo h1 { color: #25d366; font-size: 28px; font-weight: 700; }
.authBox.logo p { color: #8696a0; font-size: 14px; margin-top: 4px; }
.authBox.auth-title { color: #e9edef; font-size: 18px; font-weight: 600; margin-bottom: 24px; text-align: center; }
.authBox input { width: 100%; padding: 14px 18px; margin: 6px 0 12px 0; border: 1px solid #3b4a54; border-radius: 12px; background: #2a3942; color: #e9edef; font-size: 15px; outline: none; }
.authBox input:focus { border-color: #25d366; }
.authBox.auth-btn { width: 100%; padding: 14px; margin-top: 8px; border: 0; border-radius: 12px; background: #25d366; color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
.authBox.auth-btn:disabled { opacity: 0.6; }
.authBox.auth-switch { background: transparent!important; color: #25d366!important; }
.authBox.auth-message { text-align: center; margin-top: 12px; font-size: 13px; min-height: 20px; }
.authBox.auth-message.success { color: #25d366; }
.authBox.auth-message.error { color: #ff6b6b; }
#app { height: 100vh; max-width: 700px; margin: 0 auto; background: #111b21; display: flex; flex-direction: column; }
.header { height: 60px; padding: 0 16px; background: #202c33; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a3942; }
.tabs { display: flex; background: #202c33; border-bottom: 1px solid #2a3942; }
.tabs button { flex: 1; padding: 12px 0; background: transparent; border: 0; color: #8696a0; font-size: 13px; font-weight: 500; text-transform: uppercase; cursor: pointer; }
.tabs button.active { color: #25d366; }
.chat-list-container { flex: 1; overflow-y: auto; background: #111b21; padding: 8px 0; }
.search-wrapper { padding: 8px 16px; background: #111b21; }
.search-wrapper input { width: 100%; padding: 10px 16px; border: 0; border-radius: 20px; background: #202c33; color: #e9edef; outline: none; }
.chat-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #1f2c33; }
.chat-item:hover { background: #1f2c33; }
.chat-item.avatar { width: 50px; height: 50px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 20px; color: white; }
.chat-item.chat-info { flex: 1; }
.chat-item.chat-info.name { display: block; font-weight: 500; color: #e9edef; }
.chat-item.chat-info.last-msg { display: block; color: #8696a0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#chatWindow { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 700px; height: 100vh; background: #0b141a; z-index: 200; display: flex; flex-direction: column; }
.chat-header { height: 60px; padding: 0 16px; background: #202c33; display: flex; align-items: center; gap: 14px; }
.messages-container { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; background: #0b141a; }
.message { padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 14.5px; }
.message.sent { background: #005c4b; align-self: flex-end; }
.message.received { background: #202c33; align-self: flex-start; }
.message-input-container { padding: 8px 16px; background: #202c33; display: flex; gap: 10px; }
.message-input-container input { flex: 1; padding: 10px 18px; border: 0; border-radius: 20px; background: #2a3942; color: #e9edef; outline: none; }
.message-input-container.send-btn { padding: 10px 18px; border: 0; border-radius: 20px; background: #25d366; color: white; font-weight: 600; cursor: pointer; }
.page-content { padding: 20px; flex: 1; overflow-y: auto; }
.profile-card { background: #202c33; padding: 30px; border-radius: 16px; text-align: center; }
.profile-card.profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 600; color: white; margin: 0 auto 16px; }
.fab { position: fixed; right: 20px; bottom: 90px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: #25d366; color: white; font-size: 28px; cursor: pointer; }
</style>
</head>
<body>

<section id="authScreen">
    <div class="authBox">
        <div class="logo"><h1>💬 JDA Networks</h1><p>Connect with friends & family</p></div>
        <div class="auth-title" id="authTitle">Sign in to your account</div>
        <input type="email" id="email" placeholder="Email address">
        <input type="password" id="password" placeholder="Password (min 6 chars)">
        <button class="auth-btn" id="authButton">Sign In</button>
        <button class="auth-btn auth-switch" id="switchAuth">Create a new account</button>
        <div class="auth-message" id="authMessage"></div>
    </div>
</section>

<section id="app" class="hidden">
    <header class="header"><span>JDA Networks</span><button onclick="logout()" style="background:#d9534f;color:white;border:0;padding:6px 12px;border-radius:8px;cursor:pointer;">Logout</button></header>
    <div class="tabs"><button class="active">Chats</button></div>
    <div class="chat-list-container">
        <div class="search-wrapper"><input id="chatSearch" placeholder="Search" oninput="filterChats(this.value)"></div>
        <div id="chatList"></div>
    </div>
    <button class="fab" onclick="startNewChat()">✏️</button>
</section>

<div id="chatWindow" class="hidden">
    <div class="chat-header">
        <button onclick="closeChat()" style="background:transparent;border:0;color:#aebac1;font-size:24px;cursor:pointer;">←</button>
        <div id="chatAvatar" style="width:40px;height:40px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-weight:600;">U</div>
        <div><span id="chatUserName">User</span></div>
    </div>
    <div id="messagesContainer" class="messages-container"></div>
    <div class="message-input-container"><input id="messageInput" placeholder="Type a message" onkeypress="if(event.key==='Enter') sendMessage()"><button class="send-btn" onclick="sendMessage()">Send</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, getDocs, setDoc, doc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAPnOHdVISPw_fGBLdMLELSU9f1IWMTC3I",
    authDomain: "jda-network-fabde.firebaseapp.com",
    projectId: "jda-network-fabde",
    storageBucket: "jda-network-fabde.firebasestorage.app",
    messagingSenderId: "383915852673",
    appId: "1:383915852673:web:4b185c0387ed0bbad1de80"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let creatingAccount = false;
let currentUser = null;
let currentChatUser = null;
let unsubscribeMessages = null;

const authScreen = document.getElementById("authScreen");
const appScreen = document.getElementById("app");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const authButton = document.getElementById("authButton");
const switchAuth = document.getElementById("switchAuth");
const authTitle = document.getElementById("authTitle");
const authMessage = document.getElementById("authMessage");
const chatList = document.getElementById("chatList");

switchAuth.addEventListener("click", () => {
    creatingAccount =!creatingAccount;
    authTitle.textContent = creatingAccount? "Create your account" : "Sign in to your account";
    authButton.textContent = creatingAccount? "Create Account" : "Sign In";
    switchAuth.textContent = creatingAccount? "Already have an account? Sign in" : "Create a new account";
    authMessage.textContent = "";
});

authButton.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    if(!email ||!password){ authMessage.textContent = "❌ Enter email and password"; authMessage.className="auth-message error"; return; }
    if(password.length < 6){ authMessage.textContent = "❌ Password must be 6+ characters"; authMessage.className="auth-message error"; return; }
    authMessage.textContent = "⏳ Please wait..."; authButton.disabled = true;
    try{
        if(creatingAccount){ await createUserWithEmailAndPassword(auth, email, password); authMessage.textContent = "✅ Account created!"; }
        else{ await signInWithEmailAndPassword(auth, email, password); authMessage.textContent = "✅ Welcome back!"; }
        authMessage.className = "auth-message success";
    }catch(error){
        let msg = error.message;
        if(error.code==='auth/email-already-in-use') msg = "Email already exists. Try Sign In.";
        if(error.code==='auth/invalid-credential' || error.code==='auth/wrong-password') msg = "Wrong email or password.";
        if(error.code==='auth/user-not-found') msg = "No account found. Create new account.";
        authMessage.textContent = "❌ "+msg; authMessage.className="auth-message error";
        console.error(error);
    }finally{ authButton.disabled = false; }
});

onAuthStateChanged(auth, async (user) => {
    if(user){
        currentUser = user;
        authScreen.classList.add("hidden"); appScreen.classList.remove("hidden");
        await setDoc(doc(db, "users", user.uid), { email: user.email, displayName: user.email.split('@')[0], createdAt: serverTimestamp() }, {merge:true});
        loadChats();
    }else{
        currentUser=null; authScreen.classList.remove("hidden"); appScreen.classList.add("hidden");
        if(unsubscribeMessages) unsubscribeMessages();
    }
});

window.logout = async () => { if(confirm("Logout?")) await signOut(auth); };

async function loadChats(){
    if(!currentUser) return;
    chatList.innerHTML = '<p style="text-align:center;color:#8696a0;padding:40px;">Loading...</p>';
    try{
        const snap = await getDocs(collection(db, "users"));
        let users = []; snap.forEach(d=>{ if(d.id!==currentUser.uid) users.push({uid:d.id,...d.data()}); });
        if(users.length===0){ chatList.innerHTML = '<p style="text-align:center;color:#8696a0;padding:40px;">No contacts yet.<br>Ask friend to create account.</p>'; return; }
        chatList.innerHTML = ''; users.forEach(u=>{
            const div=document.createElement('div'); div.className='chat-item'; div.onclick=()=>openChat(u.email);
            div.innerHTML=`<div class="avatar">${(u.displayName||u.email)[0].toUpperCase()}</div><div class="chat-info"><span class="name">${u.displayName||u.email.split('@')[0]}</span><span class="last-msg">${u.email}</span></div>`;
            chatList.appendChild(div);
        });
    }catch(e){ chatList.innerHTML = '<p style="text-align:center;color:#ff6b6b;padding:40px;">Error loading. Check Firestore Rules.</p>'; console.error(e); }
}

window.filterChats = (q)=>{ document.querySelectorAll('.chat-item').forEach(item=>{ item.style.display = item.textContent.toLowerCase().includes(q.toLowerCase())? 'flex' : 'none'; }); };
window.startNewChat = ()=>{ const email=prompt("Enter friend's email:"); if(email && email!==currentUser.email) openChat(email.trim()); };

window.openChat = async (email)=>{
    currentChatUser = {email}; document.getElementById("chatUserName").textContent=email; document.getElementById("chatAvatar").textContent=email[0].toUpperCase();
    document.getElementById("chatWindow").classList.remove("hidden"); document.getElementById("app").classList.add("hidden");
    loadMessages(email);
};
window.closeChat = ()=>{ document.getElementById("chatWindow").classList.add("hidden"); document.getElementById("app").classList.remove("hidden"); if(unsubscribeMessages) unsubscribeMessages(); };

function loadMessages(otherEmail){
    if(!currentUser) return; if(unsubscribeMessages) unsubscribeMessages();
    const messagesContainer = document.getElementById("messagesContainer");
    const chatId = [currentUser.email, otherEmail].sort().join("_");
    const q = query(collection(db, "messages"), where("chatId","==",chatId), orderBy("createdAt","asc"));
    unsubscribeMessages = onSnapshot(q, (snapshot)=>{
        messagesContainer.innerHTML = '';
        if(snapshot.empty){ messagesContainer.innerHTML='<p style="text-align:center;color:#8696a0;padding:20px;">No messages yet. Say hi!</p>'; return; }
        snapshot.forEach(doc=>{
            const m=doc.data(); const div=document.createElement('div');
            div.className = 'message ' + (m.sender===currentUser.email? 'sent' : 'received');
            div.textContent = m.text; messagesContainer.appendChild(div);
        });
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
}

window.sendMessage = async ()=>{
    const input=document.getElementById("messageInput"); const text=input.value.trim(); if(!text ||!currentChatUser) return;
    const chatId=[currentUser.email, currentChatUser.email].sort().join("_");
    input.value=''; await addDoc(collection(db,"messages"),{ chatId, text, sender:currentUser.email, receiver:currentChatUser.email, createdAt:serverTimestamp() });
};
</script>
</body>
</html>
