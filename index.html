<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JDA Networks</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f2f6fc;
  color: #172033;
}

header {
  background: #18345f;
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

header h1 {
  font-size: 25px;
}

.status {
  font-size: 15px;
}

.connected {
  color: #7bdc4c;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 28px;
  margin-bottom: 22px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.welcome h2 {
  font-size: 40px;
  margin-bottom: 20px;
}

.welcome p {
  font-size: 21px;
  line-height: 1.5;
}

.section-title {
  font-size: 28px;
  margin-bottom: 20px;
}

.search {
  width: 100%;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  margin-bottom: 15px;
}

.member {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 0;
  border-bottom: 1px solid #eee;
  gap: 10px;
}

.member:last-child {
  border-bottom: none;
}

.member-info {
  flex: 1;
}

.member-name {
  font-weight: bold;
  font-size: 19px;
}

.member-phone {
  color: #777;
  margin-top: 5px;
}

.member-status {
  color: #777;
  font-size: 14px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 18px;
  font-size: 15px;
  cursor: pointer;
}

.primary {
  background: #18345f;
  color: white;
}

.primary:hover {
  background: #102747;
}

.chat-button {
  background: #1685d8;
  color: white;
}

.delete-button {
  background: #eee;
  color: #d33;
  padding: 9px 12px;
}

.empty {
  color: #777;
  font-size: 17px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 450px;
  border-radius: 20px;
  padding: 25px;
}

.modal-box h2 {
  margin-bottom: 20px;
}

.input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 10px;
  margin-bottom: 14px;
  font-size: 16px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

.cancel {
  background: #eee;
}

.chat-screen {
  display: none;
  position: fixed;
  inset: 0;
  background: #f2f6fc;
  z-index: 200;
}

.chat-header {
  background: #18345f;
  color: white;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 15px;
}

.back {
  background: transparent;
  color: white;
  font-size: 25px;
  padding: 5px;
}

.chat-header-info {
  flex: 1;
}

.chat-header-info strong {
  display: block;
  font-size: 19px;
}

.chat-header-info span {
  font-size: 13px;
  color: #b9f5a1;
}

.messages {
  height: calc(100vh - 135px);
  overflow-y: auto;
  padding: 20px;
}

.message {
  max-width: 78%;
  padding: 12px 15px;
  border-radius: 16px;
  margin-bottom: 12px;
  line-height: 1.4;
}

.sent {
  background: #18345f;
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

.received {
  background: white;
  margin-right: auto;
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.message-time {
  display: block;
  font-size: 11px;
  opacity: .7;
  margin-top: 5px;
}

.chat-input {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  padding: 10px;
  display: flex;
  gap: 8px;
}

.chat-input input {
  flex: 1;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 25px;
  font-size: 16px;
}

.send {
  background: #1685d8;
  color: white;
  border-radius: 25px;
}

.notice {
  background: #fff7d6;
  padding: 12px;
  border-radius: 10px;
  color: #765d00;
  margin-bottom: 15px;
  font-size: 14px;
}

@media(max-width:500px) {
  .container {
    padding: 12px;
  }

  .card {
    padding: 22px;
  }

  .welcome h2 {
    font-size: 34px;
  }

  .welcome p {
    font-size: 18px;
  }

  .member {
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<header>
  <h1>JDA Networks</h1>
  <div class="status">
    ● <span class="connected">Connected</span>
  </div>
</header>

<main class="container">

  <section class="card welcome">
    <h2>Welcome to JDA Networks</h2>
    <p>
      Connect with members and chat with people in your network.
    </p>
  </section>

  <section class="card">
    <h2 class="section-title">🟢 Online Members</h2>
    <div id="onlineMembers" class="empty">
      No members online yet.
    </div>
  </section>
